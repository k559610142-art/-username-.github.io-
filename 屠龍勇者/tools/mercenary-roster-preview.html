<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人傭兵名冊正式腳本驗收</title><style>#guild-preview-tools{position:fixed;top:3px;left:3px;z-index:1000;padding:6px;background:#15130fee;color:#eee;border:1px solid #876c3d;font:12px system-ui}#guild-preview-tools button{font-size:12px;padding:4px;margin:2px}</style></head><body><div id="guild-preview-tools">個人傭兵名冊驗收：記憶體存檔／禁止連外<br><button onclick="mercRosterPreviewOpen()">傭兵團長</button><button onclick="mercRosterPreviewProgress()">完成測試任務</button><button onclick="mercRosterPreviewLoad()">記憶體重登</button><button onclick="mercRosterPreviewMode('phone')">手機</button><button onclick="mercRosterPreviewMode('pc')">PC</button><span id="guild-preview-note"></span></div>
<script>
(async()=>{
 const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),key:i=>[...memory.keys()][i],get length(){return memory.size}}});
 const localFetch=window.fetch.bind(window);window.fetch=(u,o)=>{if(new URL(u,location.href).origin!==location.origin)throw Error('隔離驗收禁止連外');return localFetch(u,o)};window.WebSocket=function(){throw Error('隔離驗收禁止WebSocket')};window.XMLHttpRequest=function(){throw Error('隔離驗收禁止XHR')};
 const text=await(await fetch('index.html',{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(text,'text/html'),style=document.createElement('style');style.textContent=text.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(style);for(const link of doc.head.querySelectorAll('link[rel="stylesheet"]'))document.head.append(link.cloneNode(true));for(const script of doc.body.querySelectorAll('script'))script.remove();for(const element of [...doc.body.children])document.body.append(element);
 for(const m of text.matchAll(/<script src="(data\/[^"?]+\.js)\?v=([^"]+)"/g)){if(['data/main.js','data/pwa.js'].includes(m[1]))continue;await new Promise((ok,no)=>{const script=document.createElement('script');script.src=m[1]+'?v='+m[2]+'&roster-validation='+Date.now();script.onload=ok;script.onerror=no;document.head.append(script)})}
 const boot=document.createElement('script');boot.textContent=`

 cloudMarkDirty=()=>{};clanLoad=()=>{};presTick=()=>{};sfx=()=>{};sfxHit=()=>{};
 function mercRosterPreviewOpen(){openMercenary()}
 function mercRosterPreviewMode(mode){displayMode=mode;layoutFrame();refreshUI();openMercenary()}
 function mercRosterPreviewLoad(){const raw=localStorage.getItem(slotKey(currentSlot));if(!raw)return;applySaveData(saveParse(raw));scene=null;openMercenary();document.getElementById('guild-preview-note').textContent='已從加密記憶體存檔重開'}
 function mercRosterPreviewProgress(){if(!player.mercQuest.active){showToast('請先向團長接取任務');return}player.mercQuest.kills=MERC_QUEST_KILLS-1;mercQuestOnKill();refreshUI();openMercenary()}
 createPlayer('名冊驗收','knight',CLASSES.knight.base);playerOwner='';playerOwnerEmail='';player.lv=20;player.gold=100000;player.mercenary={cls:'war',lv:17,exp:77,hp:1,mp:0,dead:false,active:false,equip:{},skills:['','','',''],cds:{}};mercNormalize(player);const st=mercStats();player.mercenary.hp=st.hp;player.mercenary.mp=st.mp;addItem('longSword');mercEquip(player.inv.find(i=>i.id==='longSword').uid,'weapon');addItem('mercRune_wolf');mercSetRune(0,'wolf');mercToggle();saveGame();showScreen('game');displayMode='phone';layoutFrame();switchTab('town');townSub='mercenary';refreshUI();openMercenary();startScene();setInterval(()=>{gameNow+=100},100);
 `;document.body.append(boot);
})().catch(e=>{document.body.append('隔離驗收載入失敗：'+e.message);console.error(e)});
</script></body></html>
