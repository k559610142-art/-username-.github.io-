<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正式公會介面隔離驗收</title><style>#guild-preview-tools{position:fixed;top:3px;left:3px;z-index:800;padding:6px;background:#15130fee;color:#eee;border:1px solid #876c3d;font:12px system-ui}#guild-preview-tools button{font-size:12px;padding:4px;margin:2px}</style></head><body><div id="guild-preview-tools">正式公會介面隔離驗收：記憶體存檔／禁止連外<br><button onclick="guildPreviewOpen()">公會名冊</button><button onclick="guildPreviewLoad()">重開記憶體角色</button><button onclick="guildPreviewVillage()">查看村莊接待員</button><button onclick="guildPreviewMode('pc')">PC</button><button onclick="guildPreviewMode('phone')">手機</button><span id="guild-preview-note"></span></div>
<script>
(async()=>{
 const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),key:i=>[...memory.keys()][i],get length(){return memory.size}}});
 const localFetch=window.fetch.bind(window);window.fetch=(u,o)=>{if(new URL(u,location.href).origin!==location.origin)throw Error('隔離驗收禁止連外');return localFetch(u,o)};window.WebSocket=function(){throw Error('隔離驗收禁止WebSocket')};window.XMLHttpRequest=function(){throw Error('隔離驗收禁止XHR')};
 const text=await(await fetch('index.html',{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(text,'text/html'),style=document.createElement('style');style.textContent=text.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(style);for(const link of doc.head.querySelectorAll('link[rel="stylesheet"]'))document.head.append(link.cloneNode(true));for(const script of doc.body.querySelectorAll('script'))script.remove();for(const element of [...doc.body.children])document.body.append(element);
 for(const m of text.matchAll(/<script src="(data\/[^"?]+\.js)\?v=([^"]+)"/g)){if(['data/main.js','data/pwa.js'].includes(m[1]))continue;await new Promise((ok,no)=>{const script=document.createElement('script');script.src=m[1]+'?v='+m[2]+'&guild-validation='+Date.now();script.onload=ok;script.onerror=no;document.head.append(script)})}
 const boot=document.createElement('script');boot.textContent=`
 cloudMarkDirty=()=>{};cloudCanCall=()=>false;clanLoad=()=>{};presTick=()=>{};sfx=()=>{};sfxHit=()=>{};
 function guildPreviewOpen(){openGuild()}
 function guildPreviewMode(mode){displayMode=mode;layoutFrame();refreshUI()}
 function guildPreviewLoad(){const raw=localStorage.getItem(slotKey(currentSlot));if(!raw)return;applySaveData(saveParse(raw));scene=null;openGuild();document.getElementById('guild-preview-note').textContent='已從加密記憶體存檔重開'}
 function guildPreviewVillage(){switchTab('hunt');startScene()}
 createPlayer('公會驗收','mage',CLASSES.mage.base);playerOwner='';playerOwnerEmail='';saveGame();showScreen('game');displayMode='pc';layoutFrame();openGuild();startScene();setInterval(()=>{gameNow+=100},100);
 `;document.body.append(boot);
 const previewQuery=new URLSearchParams(location.search);if(previewQuery.has('guild-missions')||previewQuery.has('lost-miners')){const script=document.createElement('script');script.src=(previewQuery.has('guild-missions')?'tools/guild-missions-preview.js':'tools/guild-mission-preview.js')+'?validation='+Date.now();document.body.append(script);}
})().catch(e=>{document.body.append('隔離驗收載入失敗：'+e.message);console.error(e)});
</script></body></html>
