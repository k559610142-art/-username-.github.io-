<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>傭兵技能石共用倉庫隔離驗收</title><style>#guild-preview-tools{position:fixed;top:3px;left:3px;z-index:1000;padding:6px;background:#15130fee;color:#eee;border:1px solid #876c3d;font:12px system-ui}#guild-preview-tools button{font-size:12px;padding:4px;margin:2px}</style></head><body><div id="guild-preview-tools">技能石倉庫驗收：記憶體角色／模擬RPC／禁止連外<br><button onclick="runeVaultPreviewOpen()">共用倉庫</button><button onclick="runeVaultPreviewMode('phone')">手機</button><button onclick="runeVaultPreviewMode('pc')">PC</button></div>
<script>
(async()=>{
 window.setInterval=()=>0;
 const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),key:i=>[...memory.keys()][i],get length(){return memory.size}}});
 const localFetch=window.fetch.bind(window);window.fetch=(u,o)=>{if(new URL(u,location.href).origin!==location.origin)throw Error('隔離驗收禁止連外');return localFetch(u,o)};window.WebSocket=function(){throw Error('隔離驗收禁止WebSocket')};window.XMLHttpRequest=function(){throw Error('隔離驗收禁止XHR')};
 const text=await(await fetch('index.html',{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(text,'text/html'),style=document.createElement('style');style.textContent=text.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(style);for(const link of doc.head.querySelectorAll('link[rel="stylesheet"]'))document.head.append(link.cloneNode(true));for(const script of doc.body.querySelectorAll('script'))script.remove();for(const element of [...doc.body.children])document.body.append(element);
 for(const m of text.matchAll(/<script src="(data\/[^"?]+\.js)\?v=([^"]+)"/g)){if(['data/main.js','data/pwa.js'].includes(m[1]))continue;await new Promise((ok,no)=>{const script=document.createElement('script');script.src=m[1]+'?v='+m[2]+'&roster-validation='+Date.now();script.onload=ok;script.onerror=no;document.head.append(script)})}
 const boot=document.createElement('script');boot.textContent=`


 cloudMarkDirty=()=>{};clanLoad=()=>{};presTick=()=>{};sfx=()=>{};sfxHit=()=>{};cloudSb={};cloudUser={id:'vault-rune-preview'};authUid=()=>cloudUser.id;
 function runeVaultPreviewOpen(){switchTab('town');townSub='storage';storageMode='vault';refreshUI()}
 function runeVaultPreviewMode(mode){displayMode=mode;layoutFrame();runeVaultPreviewOpen()}
 createPlayer('技能石驗收','knight',CLASSES.knight.base);playerOwner=cloudUser.id;player.gold=10000;addItem('mercRune_wolf',10);addItem('mercRune_heal',8);addItem('mercRune_star',3);vaultData={gold:0,items:[]};let nextVaultId=1,previewSeq=0;
 vaultLoad=async()=>{vaultRender()};
 vaultOp=async(fn,args,apply)=>{
  if(player.gold<VAULT_FEE)throw Error('金幣不足');
  if(fn==='vault_put2'&&args.p_uid!=null){const it=findInv(args.p_uid),n=args.p_n;if(!it||!vaultStorable(it)||!Number.isInteger(n)||n<1||n>it.n)throw Error('無法存入');vaultData.items.push({id:nextVaultId++,item:{...it,n},name:itemName(it)});apply({n,gold:-VAULT_FEE,seq:++previewSeq,t:Date.now()})}
  else if(fn==='vault_take2'&&args.p_id!=null){const index=vaultData.items.findIndex(v=>v.id===args.p_id);if(index<0)throw Error('此物已取出');const row=vaultData.items.splice(index,1)[0];apply({item:row.item,name:row.name,gold:-VAULT_FEE,seq:++previewSeq,t:Date.now()})}
  else throw Error('此隔離畫面只模擬道具存取');
  saveGame();refreshUI();
 };
 saveGame();showScreen('game');displayMode='phone';layoutFrame();runeVaultPreviewOpen();
 `;document.body.append(boot);
})().catch(e=>{document.body.append('隔離驗收載入失敗：'+e.message);console.error(e)});
</script></body></html>
