<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1"><title>傭兵框架隔離預覽</title>
<style>#merc-preview-tools{position:fixed;top:4px;left:4px;z-index:100;background:#17120de8;border:1px solid #aa8844;padding:4px;color:#fff;font:12px sans-serif}#merc-preview-tools button{font-size:12px;padding:4px;margin:2px}</style></head><body>
<div id="merc-preview-tools">傭兵隔離預覽：記憶體存檔／禁止連外<br><button onclick="mercPreviewSeed()">建立測試傭兵</button><button onclick="mercPreviewQuestProgress()">任務推進4999</button><button onclick="mercQuestOnKill();refreshUI();openMercenary()">任務擊殺1</button><button onclick="mercPreviewMode('pc')">PC</button><button onclick="mercPreviewMode('phone')">手機</button><button onclick="openMercenary()">傭兵介面</button><button onclick="switchTab('char')">人物欄</button><button onclick="mercDie();refreshUI();openMercenary()">模擬陣亡</button><button onclick="mercPreviewLoad()">記憶體重登</button><button onclick="mercPreviewRanks()">階級展示</button><button onclick="mercPreviewSockets()">鑲嵌展示</button><button onclick="mercPreviewBoard()">只看石板</button></div>
<script>
(async()=>{
    const memory=new Map();
    Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),key:i=>[...memory.keys()][i],get length(){return memory.size;}}});
    const localFetch=window.fetch.bind(window);
    window.fetch=(u,o)=>{if(new URL(u,location.href).origin!==location.origin)throw Error('隔離預覽禁止連外');return localFetch(u,o);};
    const index=await(await fetch('index.html',{cache:'no-store'})).text(),style=document.createElement('style');
    style.textContent=index.match(/<style>([\s\S]*?)<\/style>/)[1];document.head.prepend(style);
    const doc=new DOMParser().parseFromString(index,'text/html');
    for(const script of doc.body.querySelectorAll('script'))script.remove();
    for(const child of [...doc.body.children])document.body.append(child);
    for(const m of index.matchAll(/<script src="(data\/[^"?]+\.js)\?v=([^"]+)"/g)){
        if(['data/main.js','data/pwa.js'].includes(m[1]))continue;
        await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=m[1]+'?v='+m[2]+'&preview=mercenary-'+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});
    }
    window.mercPreviewQuestProgress=()=>{if(!player.mercQuest.active||player.mercenary&&!player.mercenary.dead)return;while(player.mercQuest.kills<4999)mercQuestOnKill();refreshUI();openMercenary();};
    window.mercPreviewSeed=()=>{if(player.mercenary)return;const m=player.mercenary={cls:'spirit',lv:1,exp:0,hp:1,mp:0,cds:{},equip:{},skills:['','','',''],dead:false,active:false};const st=mercStats(m);m.hp=st.hp;m.mp=st.mp;refreshUI();openMercenary();};
    window.mercPreviewBoard=()=>{if(player.mercenary)openDialog('傭兵技能鑲嵌',mercRuneBoardHtml(player.mercenary,mercTownReady()));};
    window.mercPreviewSockets=()=>{if(!player.mercenary){showToast('請先建立記憶體測試傭兵');return;}['wolf','shield','firebolt',''].forEach((id,i)=>mercSetRune(i,id));openMercenary();};
    window.mercPreviewRanks=()=>openDialog('傭兵七階展示', MERC_RANKS.map((r,i)=>'<div class="panel" style="padding:6px;margin:3px 0">'+mercNameHtml({cls:'spirit',lv:r.min})+'<small style="display:block">'+r.min+(MERC_RANKS[i+1]?'～'+(MERC_RANKS[i+1].min-1)+'級':'級以上')+'</small></div>').join(''));
    let previewTimer=0;
    window.mercPreviewBattle=()=>{
        if(!player.mercenary)mercPreviewSeed();
        closeDialog();mercPanelOpen=false;lootMode='legacy';
        const m=player.mercenary;m.lv=30;m.active=true;m.dead=false;m.skills=['wolf','iceSpirit','nova','heal'];m.cds={};mercRuntime.delete(m);
        m.hp=mercStats(m).hp;m.mp=mercStats(m).mp;player.baseHp=10000;player.hp=calcStats().maxHp;player.loc={type:'zone',id:'island'};scene=null;hunt=null;session=null;switchTab('hunt');startHunt();refreshUI();
        clearInterval(previewTimer);previewTimer=setInterval(()=>{gameNow+=100;cleanBuffs();if(!hunt||hunt.state!=='fight')mercTick(100);huntTick(100);renderStatus();if(huntVisible())updateHuntLive();},100);
    };
    window.mercPreviewNegative=()=>{if(!player.mercenary)return;const mon={id:'venomSpider'};mercEnemyStatus(mon,true,50,player);mercEnemyStatus({id:'frostWitch'},true,30,player.mercenary);renderStatus();};
    window.mercPreviewCleanse=()=>{const m=player.mercenary;if(!m)return;m.skills=['firebolt','might','purify','cleanse'];m.mp=mercStats(m).mp;mercRuntime.delete(m);refreshUI();};
    let dodgeMonitor=0;
    window.mercPreviewBossDodge=()=>{
        mercPreviewBattle();buildScene();player.settings.autoDodge=true;
        const pl=scene.pl,m=player.mercenary;m.skills=['','','',''];m.hp=mercStats(m).hp;scene.mons=[];
        const spot=[[3,0],[-3,0],[0,3],[0,-3]].map(([x,y])=>[pl.x+x,pl.y+y]).find(([x,y])=>freeTileFor(x,y)&&inHuntZone(x,y));
        if(!spot){showToast('此處無測試首領空位，請重試');return;}
        const mon=makeMonster(currentZone().mons[0]);Object.assign(mon,{name:'紅圈測試首領',boss:true,hp:1000000,maxHp:1000000,dmg:[40,40],teleCd:99999,atkCd:99999});
        hunt.mon=mon;hunt.mobs=[mon];hunt.state='fight';hunt.joinCd=99999;
        scene.mons=[{x:spot[0],y:spot[1],rx:spot[0],ry:spot[1],inst:mon,mid:mon.id,name:mon.name,icon:mon.icon,cd:99999,dying:0,lastHp:mon.hp}];
        scene.mercenary=null;sceneMercTick(0);
        const t=hunt.tele={mob:mon,name:'測試紅圈',start:gameNow,until:gameNow+1600};scene.tele={ref:t,x:pl.x,y:pl.y,r:1.5,react:350};
        const c=scene.tele,before=[player.hp,m.hp];let line=$('merc-dodge-result');if(!line){line=document.createElement('div');line.id='merc-dodge-result';$('merc-preview-tools').append(line);}
        clearInterval(dodgeMonitor);dodgeMonitor=setInterval(()=>{const d=scene&&scene.mercenary;if(!d)return;line.textContent=(hunt&&hunt.tele===t?'紅圈預警':'結算完成')+'｜玩家'+(sceneTeleContains(c,pl.rx,pl.ry)?'圈內':'圈外')+' HP '+Math.round(player.hp)+'／'+before[0]+'｜傭兵'+(sceneTeleContains(c,d.rx,d.ry)?'圈內':'圈外')+' HP '+Math.round(m.hp)+'／'+before[1];if(!hunt||hunt.tele!==t)clearInterval(dodgeMonitor);},50);
    };
    window.mercPreviewPotion=()=>{mercPreviewBattle();clearInterval(previewTimer);const m=player.mercenary;m.skills=['','','',''];m.hp=Math.floor(mercStats(m).hp*.25);const hp=m.hp,n=healPotionCount(),ph=player.hp;mercAutoPotion();refreshUI();let line=$('merc-potion-result');if(!line){line=document.createElement('div');line.id='merc-potion-result';$('merc-preview-tools').append(line);}line.textContent='共用藥水 '+n+'→'+healPotionCount()+' 瓶｜傭兵 HP '+hp+'→'+m.hp+'｜玩家 HP '+ph+'→'+player.hp;};
    for(const [text,fn]of [['技能戰鬥測試',mercPreviewBattle],['附加毒／緩速',mercPreviewNegative],['切換淨化配置',mercPreviewCleanse],['雙方紅圈閃避',mercPreviewBossDodge],['共用藥水測試',mercPreviewPotion]]){const b=document.createElement('button');b.textContent=text;b.onclick=fn;$('merc-preview-tools').append(b);}
    let saved='';sfx=()=>{};presTick=()=>{};
    saveGame=()=>{saved=saveEncode(JSON.stringify({schema:SAVE_SCHEMA,player}));};
    createPlayer('傭兵預覽','knight',CLASSES.knight.base);player.gold=1000000;player.lv=30;
    addItem('longSword');addItem('bow');addItem('magicCrystal',100);
    for(const id of Object.keys(MERC_RUNES))addItem('mercRune_'+id);
    window.mercPreviewMode=mode=>{displayMode=mode;layoutFrame();refreshUI();};
    window.mercPreviewLoad=()=>{if(!saved)return;player=guardWrap(migrateSave(saveParse(saved)));hunt=null;scene=null;switchTab('town');townSub='mercenary';refreshUI();openMercenary();};
    showScreen('game');displayMode='pc';layoutFrame();switchTab('town');townSub='mercenary';refreshUI();
    
})().catch(e=>{document.body.append('預覽錯誤：'+e.stack);console.error(e);});
</script></body></html>
