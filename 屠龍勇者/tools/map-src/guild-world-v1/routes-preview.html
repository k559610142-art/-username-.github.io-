<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>低語海島探索配置</title><style>body{margin:0;background:#111a24;color:#eee5d5;font:16px/1.7 system-ui,sans-serif}main{max-width:1536px;margin:auto;padding:18px}h1{font-size:24px}img{width:100%;height:auto}ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px;list-style:none;padding:0}strong{color:#ffd668}p{color:#c6bba6}</style><main><h1>低語海島：整島探索配置</h1><p>地貌配置提案，尚未接入遊戲。點圖片可開啟原尺寸查看。</p><a href="whispering-isle-routes-v1.svg" target="_blank"><img src="whispering-isle-routes-v1.svg" alt="低語海島主環路、支線、山道及船路配置"></a><ol><li><strong>01</strong> 港村／公會</li><li><strong>02</strong> 礦坑入口</li><li><strong>03</strong> 古寺遺跡</li><li><strong>04</strong> 森林探索</li><li><strong>05</strong> 河谷石橋</li><li><strong>06</strong> 山頂湖泊</li><li><strong>07</strong> 古墓入口</li><li><strong>08</strong> 瞭望塔</li><li><strong>09</strong> 海崖堡壘</li><li><strong>10</strong> 燈塔海岸</li><li><strong>11</strong> 沉船灣</li><li><strong>12</strong> 離岸小島</li></ol><p>所有12個地標都有連接方案；海面、峭壁與建築牆體仍為阻擋。這不是沿線以外都不能走：森林空地、營地、沙灘與庭院還會建立可自由移動面域。</p></main></html>
