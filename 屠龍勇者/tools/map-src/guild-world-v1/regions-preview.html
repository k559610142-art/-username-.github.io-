<style>
*{box-sizing:border-box}body{margin:0;background:#101814;color:#ece9db;font:15px/1.7 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:36px 24px 60px}.eyebrow{color:#c7ad78;font-size:13px;letter-spacing:3px}h1{font-size:34px;line-height:1.3;margin:12px 0}h2{margin:0;font-size:25px;color:#ead49f}p{color:#b8c4b6;max-width:900px}.facts{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.facts span{padding:6px 13px;border:1px solid #475541;border-radius:30px;color:#d6dfc9;background:#1b291f}.region{margin-top:42px}.route{border-left:2px solid #a48c55;padding-left:15px;margin:14px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#1b281f;border:1px solid #42513e;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#26362b}.body{padding:17px;display:flex;flex-direction:column;flex:1}.body h3{font-size:18px;line-height:1.4;margin:0;color:#f1dfb6}.body p{font-size:13px;margin:9px 0 18px;flex:1}.body a{display:block;text-decoration:none;text-align:center;padding:9px 15px;background:#3e593c;border:1px solid #718361;border-radius:6px;color:#f5ecd6}.body a:hover{background:#56744a}.notice{margin-top:36px;padding:18px;border:1px solid #635b3c;background:#25291d;border-radius:9px}.notice p{margin:4px 0}.back{color:#d9bd81}@media(max-width:520px){main{padding:24px 16px}h1{font-size:28px}.grid{grid-template-columns:1fr}.region{margin-top:30px}}

<main><div class="eyebrow">黑暗大陸 · 傭兵公會</div><h1>三大地區，沿路探索</h1><p>從港村與中央古林出發，穿過礦坑、古寺與堡壘，再從海岸搭船。熔火洞窟可逐層深入；沉船群島可沿退潮沙洲走訪雙島。</p><div class="facts"><span>17 處可走場景</span><span>15 張新增原創背景</span><span>四人隊伍通行</span><span>道路與碼頭往返</span></div>
<div id="regions"></div><div class="notice"><strong>地圖驗收版</strong><p>點地面、WASD 或方向鍵移動，走近出入口再換區；勾選可走範圍可檢查邊界。總覽連結會重新開始該場景預覽。</p><p>目前為獨立分區地圖，尚非無縫世界；角色沿用既有模型。此頁不進行正式任務或發獎。</p></div></main>
<script src="region-catalog.js?v=20261103u"></script>
<script>
'use strict';
const descriptions={'低語海島':'港村 ↔ 中央古林 ↔ 礦坑與地下作業區 ↔ 古寺湖岸 ↔ 海崖堡壘 ↔ 燈塔碼頭；船往離岸小島與其他大區。','熔火群山':'山麓營地 ↔ 灰燼谷 ↔ 廢棄鍛爐 ↔ 洞窟第一層 ↔ 第二層 ↔ 第三層 ↔ 龍巢外圍。','沉船群島':'群島港口 ↔ 雨林 ↔ 走私營地 ↔ 北部堡壘 ↔ 退潮雙島、古墓封印與沉船寶庫。'};
function addCard(grid,name,art,note,url){const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=art;image.alt=name+'場景';image.width=384;image.height=256;image.loading='lazy';image.decoding='async';const body=document.createElement('div');body.className='body';const title=document.createElement('h3');title.textContent=name;const info=document.createElement('p');info.textContent=note;const link=document.createElement('a');link.textContent='探索此區';link.href=url;body.append(title,info,link);card.append(image,body);grid.appendChild(card)}
for(const region of ['低語海島','熔火群山','沉船群島']){const section=document.createElement('section');section.className='region';const title=document.createElement('h2');title.textContent=region;const route=document.createElement('p');route.className='route';route.textContent=descriptions[region];const grid=document.createElement('div');grid.className='grid';section.append(title,route,grid);document.getElementById('regions').appendChild(section);if(region==='低語海島'){addCard(grid,'港村公會周邊','harbor-district-art-v1.png','公會廣場、階梯、雙碼頭與城門。','harbor-walk-preview.html');addCard(grid,'中央古林','forest-district-art-v1.png','遺跡、石橋、東岸營地與北側林道。','forest-walk-preview.html')}for(const [id,map]of Object.entries(GUILD_MAPS)){if(map.region!==region)continue;const asset=map.art.replace('-district-art-v1.png','');addCard(grid,map.name,'region-thumbs-v1/'+asset+'.jpg',map.note,'region-walk-preview.html?map='+id)}}
</script></html>
