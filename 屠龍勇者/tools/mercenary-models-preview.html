<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六位傭兵模型動畫</title>
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#171914;color:#e8dcc2;font-family:"Microsoft JhengHei",sans-serif}h1{font-size:24px}p{color:#acae9b;font-size:13px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select,button{padding:8px;background:#34382b;color:#eee3c7;border:1px solid #7c7c60;border-radius:5px}.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.model{background:radial-gradient(ellipse at 50% 60%,#414735,#282b23);border:1px solid #545c45;border-radius:8px;text-align:center;padding:12px}.model canvas{width:100%;max-width:384px;height:auto}.model h2{font-size:17px;margin:4px}.model p{margin:8px}.mini{height:64px;display:flex;justify-content:center;align-items:end}.mini canvas{width:100px;height:64px}.status{border-left:3px solid #b2a35e;padding:10px;background:#2c3024}</style>
</head><body><h1>黑暗大陸 · 六位傭兵模型</h1><p>原創透明模型｜三方向，向左鏡射｜走路、攻擊、施法、受傷｜純素材預覽，不讀寫角色</p>
<div class="controls"><label>動作 <select id="action"><option value="walk">走路</option><option value="attack">攻擊</option><option value="cast">施法</option><option value="hit">受傷</option></select></label><label>方向 <select id="direction"><option value="down">正面</option><option value="right">向右</option><option value="up">背面</option><option value="left">向左</option></select></label><button id="pause">暫停動畫</button></div><div id="models" class="models"></div><p id="status" class="status">載入模型…</p>
<script>
const modelRows=[],modelNames={spirit:['璃音・契靈師','女／孩童'],bulwark:['雷恩・壁壘衛士','男／中年'],wish:['米菈・祈願使','女／中年'],war:['凱洛・征戰者','男／年輕'],wild:['莉雅・荒野行者','女／年輕'],arcane:['諾亞・秘法使','男／孩童']};let modelPaused=false,modelTime=0,modelLast=0;
document.getElementById('pause').onclick=()=>{modelPaused=!modelPaused;document.getElementById('pause').textContent=modelPaused?'繼續動畫':'暫停動畫';};
function drawModel(row,time){const action=document.getElementById('action').value,dir=document.getElementById('direction').value,sp=row.manifest,an=sp.actions[action],d=dir==='left'?'right':dir,frame=Math.floor(time/an.ms)%an.frames[d],ri={down:0,right:1,up:2}[d];for(const [canvas,k,footY]of [[row.canvas,1,290],[row.mini,sp.drawH/sp.charH,60]]){const ctx=canvas.getContext('2d'),x=canvas.width/2;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();if(dir==='left'){ctx.translate(canvas.width,0);ctx.scale(-1,1);}ctx.drawImage(row.images[action],frame*sp.cellW,ri*sp.cellH,sp.cellW,sp.cellH,x-sp.foot[0]*k,footY-sp.foot[1]*k,sp.cellW*k,sp.cellH*k);ctx.restore();}}
async function loadModels(){for(const[id,names]of Object.entries(modelNames)){const manifest=await(await fetch('images/sprites/mercenary/companions-v1/'+id+'/manifest.json')).json(),images={};for(const[action,spec]of Object.entries(manifest.actions)){images[action]=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=spec.src;});}const card=document.createElement('article');card.className='model';const heading=document.createElement('h2');heading.textContent=names[0];const sub=document.createElement('p');sub.textContent=names[1];const canvas=document.createElement('canvas');canvas.width=384;canvas.height=320;canvas.setAttribute('aria-label',names[0]+'動畫');const miniBox=document.createElement('div');miniBox.className='mini';const mini=document.createElement('canvas');mini.width=100;mini.height=64;miniBox.append(mini);const hint=document.createElement('p');hint.textContent='下方為地圖實際比例';card.append(heading,sub,canvas,miniBox,hint);document.getElementById('models').append(card);modelRows.push({manifest,images,canvas,mini});document.getElementById('status').textContent='已載入 '+modelRows.length+'／6 位模型';}requestAnimationFrame(animateModels);}
function animateModels(time){if(!modelPaused)modelTime+=modelLast?time-modelLast:0;modelLast=time;for(const row of modelRows)drawModel(row,modelTime);requestAnimationFrame(animateModels);}
loadModels().catch(e=>{document.getElementById('status').textContent='模型載入失敗';console.error(e);});
</script></body></html>
