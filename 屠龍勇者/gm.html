<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>屠龍勇者 GM</title>
<!-- 屠龍勇者管理頁（ARCHITECTURE.md 第 31 節）：可疑紀錄、玩家存檔歷程、封鎖帳號。
     只有 dragon_admins 名單裡的帳號看得到資料（資料庫 RLS 檢查，這頁本身不藏任何金鑰）。 -->
<style>
    :root {
        --bg: #12100c; --panel: #1f1b15; --panel2: #2c261d; --line: #3d3427;
        --text: #efe6d2; --muted: #9d927d; --gold: #e8c066; --accent: #a8432e;
        --good: #7fc46a; --warn: #e0a64a; --bad: #e0605a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; }
    #app { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 22px; color: var(--gold); }
    button { font: inherit; color: var(--text); background: var(--accent); border: 1px solid #0003; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    button.secondary { background: var(--panel2); border-color: var(--line); }
    button.danger { background: #6b1f1f; }
    button.mini { padding: 2px 8px; font-size: 12px; }
    button:disabled { opacity: .4; cursor: default; }
    input, select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .muted { color: var(--muted); }
    .bad { color: var(--bad); } .good { color: var(--good); } .warn { color: var(--warn); }
    .tabs button.on { background: var(--gold); color: #2a1d08; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: normal; white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .kind { display: inline-block; padding: 0 6px; border-radius: 4px; background: #5a2a1e; font-size: 12px; white-space: nowrap; }
    .hidden { display: none !important; }
    #modal { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; width: 100%; max-width: 900px; max-height: 88vh; overflow: auto; }
</style>
</head>
<body>
<div id="app">
    <div class="row" style="justify-content:space-between">
        <h1>🐉 屠龍勇者 GM</h1>
        <div class="row"><span id="who" class="muted"></span><button id="btn-out" class="secondary mini hidden" onclick="gmSignOut()">登出</button></div>
    </div>

    <div id="login" class="panel hidden">
        <p style="margin-top:0">用你在遊戲裡註冊的帳號登入（要先被加進管理者名單）。</p>
        <div class="row"><input id="em" type="text" placeholder="Email" autocomplete="username">
            <input id="pw" type="password" placeholder="密碼" autocomplete="current-password">
            <button onclick="gmSignIn()">登入</button></div>
        <p id="login-msg" class="bad"></p>
    </div>

    <div id="notadmin" class="panel hidden">
        <p class="bad" style="margin-top:0">這個帳號不在管理者名單裡。</p>
        <p class="muted">到 Supabase → SQL Editor 執行（Email 換成這個帳號）：<br>
        <code>insert into public.dragon_admins select id from auth.users where email = '<span id="na-email"></span>' on conflict do nothing;</code><br>
        執行後重新整理這頁。</p>
    </div>

    <div id="main" class="hidden" style="display:flex;flex-direction:column;gap:12px">
        <div class="row tabs">
            <button data-tab="flags" onclick="gmTab('flags')">⚠️ 可疑紀錄</button>
            <button data-tab="players" onclick="gmTab('players')">👥 玩家</button>
            <button data-tab="chat" onclick="gmTab('chat')">💬 聊天</button>
            <button data-tab="bans" onclick="gmTab('bans')">⛔ 封鎖名單</button>
            <button class="secondary" onclick="gmLoad()">🔄 重新整理</button>
        </div>
        <div id="view" class="panel"></div>
    </div>
</div>
<div id="modal" class="hidden" onclick="if (event.target === this) gmClose()"><div class="box" id="modal-box"></div></div>

<script src="data/config.js?v=20261010j"></script>
<script src="data/classes.js?v=20261010j"></script>
<script src="data/cloud.js?v=20261010j"></script>
<script>
const KIND_NAMES = { exp_rate: '經驗暴增', gold_rate: '金幣暴增', stat: '能力值超過上限', elixir: '萬能藥超量', enchant: '強化超過 +15', level: '等級異常', gold_negative: '金幣為負', clock: '裝置時間異常', parse: '存檔格式異常' };
let sb = null, me = null, tab = 'flags', showResolved = false, playerQuery = '';
let flags = [], profiles = [], saves = [], bans = [], chats = [], mutes = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => v == null ? '' : Math.round(Number(v)).toLocaleString('en-US');
const t = s => s ? new Date(s).toLocaleString('zh-TW', { hour12: false }) : '';
const clsName = c => (CLASSES[c] && CLASSES[c].name) || c || '';
function show(id, on) { $(id).classList.toggle('hidden', !on); }

async function q(p) { const r = await p; if (r.error) throw r.error; return r.data; }

async function gmInit() {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = CLOUD_SDK_URL; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    sb = window.supabase.createClient(CLOUD_SUPABASE_URL, CLOUD_SUPABASE_KEY, { auth: { storageKey: 'dragonSlayer_gm_auth', persistSession: true } });
    const { data } = await sb.auth.getSession();
    if (data.session) await gmAfterLogin(data.session.user); else show('login', true);
}

async function gmSignIn() {
    $('login-msg').textContent = '登入中…';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (error) { $('login-msg').textContent = /Invalid login/.test(error.message) ? 'Email 或密碼錯誤' : error.message; return; }
    $('login-msg').textContent = '';
    await gmAfterLogin(data.user);
}

async function gmSignOut() { await sb.auth.signOut(); location.reload(); }

async function gmAfterLogin(u) {
    me = u;
    show('login', false); show('btn-out', true);
    $('who').textContent = u.email;
    const { data: admin } = await sb.rpc('dragon_is_admin');
    if (!admin) { $('na-email').textContent = u.email; show('notadmin', true); return; }
    show('main', true);
    gmTab('flags');
}

function gmTab(x) {
    tab = x;
    document.querySelectorAll('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    gmLoad();
}

async function gmLoad() {
    $('view').innerHTML = '<p class="muted">讀取中…</p>';
    try {
        bans = await q(sb.from('dragon_bans').select('*').order('at', { ascending: false }));
        if (tab === 'flags') {
            let qq = sb.from('dragon_flags').select('*').order('at', { ascending: false }).limit(200);
            if (!showResolved) qq = qq.eq('resolved', false);
            flags = await q(qq);
        } else if (tab === 'chat') {
            chats = await q(sb.from('dragon_chat').select('*').order('id', { ascending: false }).limit(200));
            mutes = await q(sb.from('dragon_mutes').select('*').order('at', { ascending: false }));
            profiles = await q(sb.from('dragon_profiles').select('user_id, email').limit(1000));
        } else if (tab === 'players') {
            profiles = await q(sb.from('dragon_profiles').select('*').order('last_seen', { ascending: false }).limit(500));
            saves = await q(sb.from('dragon_saves').select('user_id, slot, name, cls, lv, updated_at').order('updated_at', { ascending: false }).limit(1000));
        }
        gmRender();
    } catch (e) { $('view').innerHTML = `<p class="bad">讀取失敗：${esc(e.message)}</p>`; }
}

const isBanned = uid => bans.some(b => b.user_id === uid);
const banBtn = (uid, email) => isBanned(uid)
    ? `<button class="mini secondary" onclick="gmUnban('${uid}')">解除封鎖</button>`
    : `<button class="mini danger" onclick="gmBan('${uid}', '${esc(email || '')}')">封鎖</button>`;

function gmRender() {
    if (tab === 'flags') {
        const rows = flags.map(f => `<tr class="${f.resolved ? 'muted' : ''}"><td>${t(f.at)}</td><td>${esc(f.email)}${isBanned(f.user_id) ? ' <span class="bad">⛔</span>' : ''}</td>
            <td>${esc(f.name)}（欄位 ${f.slot + 1}・Lv.${f.lv ?? '?'}）</td><td><span class="kind">${esc(KIND_NAMES[f.kind] || f.kind)}</span></td><td>${esc(f.detail)}</td>
            <td><div class="row"><button class="mini secondary" onclick="gmHistory('${f.user_id}', ${f.slot}, '${esc(f.email || '')}')">歷程</button>
            ${f.resolved ? '' : `<button class="mini secondary" onclick="gmResolve(${f.id})">已處理</button>`}${banBtn(f.user_id, f.email)}</div></td></tr>`).join('');
        $('view').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="muted">伺服器每次收到存檔都會檢查；這裡只是「可疑」，請看歷程再決定要不要封鎖。</span>
            <label class="row"><input type="checkbox" ${showResolved ? 'checked' : ''} onchange="showResolved = this.checked; gmLoad()"> 顯示已處理</label></div>
            ${rows ? `<div class="table-wrap"><table><tr><th>時間</th><th>帳號</th><th>角色</th><th>類型</th><th>內容</th><th></th></tr>${rows}</table></div>` : '<p class="good">目前沒有可疑紀錄 👍</p>'}`;
    } else if (tab === 'players') {
        const qy = playerQuery.toLowerCase();
        const rows = profiles.filter(p => !qy || (p.email || '').toLowerCase().includes(qy) || saves.some(s => s.user_id === p.user_id && (s.name || '').toLowerCase().includes(qy))).map(p => {
            const chars = saves.filter(s => s.user_id === p.user_id).sort((a, b) => a.slot - b.slot)
                .map(s => `<button class="mini secondary" onclick="gmHistory('${p.user_id}', ${s.slot}, '${esc(p.email || '')}')">${esc(s.name)}・${esc(clsName(s.cls))} Lv.${s.lv}</button>`).join(' ');
            return `<tr><td>${esc(p.email)}${isBanned(p.user_id) ? ' <span class="bad">⛔ 已封鎖</span>' : ''}</td><td>${t(p.last_seen)}</td><td><div class="row">${chars || '<span class="muted">（雲端沒有角色）</span>'}</div></td><td>${banBtn(p.user_id, p.email)}</td></tr>`;
        }).join('');
        $('view').innerHTML = `<div class="row" style="margin-bottom:8px"><input id="pq" type="text" placeholder="搜尋 Email 或角色名" value="${esc(playerQuery)}" oninput="playerQuery = this.value; gmRender(); $('pq').focus()">
            <span class="muted">共 ${profiles.length} 個帳號（點角色看存檔歷程）</span></div>
            <div class="table-wrap"><table><tr><th>帳號</th><th>最後上傳</th><th>角色</th><th></th></tr>${rows}</table></div>`;
        const el = $('pq'); if (el) el.setSelectionRange(el.value.length, el.value.length);
    } else if (tab === 'chat') {
        const emailOf = uid => (profiles.find(p => p.user_id === uid) || {}).email || '';
        const muted = uid => mutes.find(m => m.user_id === uid && new Date(m.until) > new Date());
        const muteBtn = (uid, email) => muted(uid) ? `<button class="mini secondary" onclick="gmUnmute('${uid}')">解除禁言</button>`
            : `<button class="mini danger" onclick="gmMute('${uid}', '${esc(email)}')">禁言</button>`;
        const rows = chats.map(c => `<tr><td>${t(c.at)}</td><td>${c.channel === 'world' ? '世界' : '隊伍'}</td><td>${esc(c.name)} <span class="muted">Lv.${c.lv ?? '?'}</span><br><small class="muted">${esc(emailOf(c.user_id))}</small></td>
            <td style="word-break:break-word">${esc(c.text)}</td><td><div class="row"><button class="mini secondary" onclick="gmDelChat(${c.id})">刪除</button>${muteBtn(c.user_id, emailOf(c.user_id))}</div></td></tr>`).join('');
        const ml = mutes.filter(m => new Date(m.until) > new Date()).map(m => `<tr><td>${esc(m.email)}</td><td>${t(m.until)}</td><td>${esc(m.reason)}</td><td><button class="mini secondary" onclick="gmUnmute('${m.user_id}')">解除禁言</button></td></tr>`).join('');
        $('view').innerHTML = `<p class="muted" style="margin-top:0">最近 200 則（世界＋所有隊伍；訊息 3 天後自動刪除）。禁言期間不能發言，但可以正常遊玩。</p>
            ${rows ? `<div class="table-wrap"><table><tr><th>時間</th><th>頻道</th><th>發言者</th><th>內容</th><th></th></tr>${rows}</table></div>` : '<p class="muted">還沒有訊息。</p>'}
            <h3>禁言中</h3>${ml ? `<div class="table-wrap"><table><tr><th>帳號</th><th>到期</th><th>原因</th><th></th></tr>${ml}</table></div>` : '<p class="muted">沒有人被禁言。</p>'}`;
    } else {
        const rows = bans.map(b => `<tr><td>${t(b.at)}</td><td>${esc(b.email)}</td><td>${esc(b.reason)}</td><td>${esc(b.by_email)}</td><td><button class="mini secondary" onclick="gmUnban('${b.user_id}')">解除封鎖</button></td></tr>`).join('');
        $('view').innerHTML = rows ? `<div class="table-wrap"><table><tr><th>時間</th><th>帳號</th><th>原因</th><th>處理人</th><th></th></tr>${rows}</table></div>` : '<p class="muted">沒有被封鎖的帳號。</p>';
    }
}

async function gmHistory(uid, slot, email) {
    $('modal-box').innerHTML = '<p class="muted">讀取中…</p>'; show('modal', true);
    try {
        const log = await q(sb.from('dragon_save_log').select('*').eq('user_id', uid).eq('slot', slot).order('id', { ascending: false }).limit(80));
        const rows = log.map((r, i) => {
            const prev = log[i + 1], same = prev && prev.char_created === r.char_created;
            const de = same ? Number(r.total_exp) - Number(prev.total_exp) : null, dg = same ? Number(r.gold) - Number(prev.gold) : null;
            const dh = same ? (new Date(r.at) - new Date(prev.at)) / 3600000 : null;
            return `<tr><td>${t(r.at)}</td><td>${esc(r.name)}</td><td class="num">${r.lv ?? ''}</td><td class="num">${n(r.total_exp)}</td><td class="num">${de == null ? '' : (de >= 0 ? '+' : '') + n(de)}</td>
                <td class="num">${n(r.gold)}</td><td class="num">${dg == null ? '' : (dg >= 0 ? '+' : '') + n(dg)}</td><td class="num">${dh == null ? '' : dh < 1 ? Math.round(dh * 60) + ' 分' : dh.toFixed(1) + ' 時'}</td>
                <td>${(r.flags || []).map(k => `<span class="kind">${esc(KIND_NAMES[k] || k)}</span>`).join(' ')}</td></tr>`;
        }).join('');
        $('modal-box').innerHTML = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(email)}・欄位 ${slot + 1} 的存檔歷程（最近 80 筆）</h3>
            <div class="row">${banBtn(uid, email)}<button class="mini secondary" onclick="gmClose()">關閉</button></div></div>
            <p class="muted">每一列是一次雲端上傳（伺服器時間）。間隔＝和上一筆相差多久；換了不同角色時不計算差值。</p>
            ${rows ? `<div class="table-wrap"><table><tr><th>時間</th><th>角色</th><th>Lv</th><th>總經驗</th><th>經驗變化</th><th>金幣</th><th>金幣變化</th><th>間隔</th><th>異常</th></tr>${rows}</table></div>` : '<p class="muted">沒有紀錄。</p>'}`;
    } catch (e) { $('modal-box').innerHTML = `<p class="bad">讀取失敗：${esc(e.message)}</p><button onclick="gmClose()">關閉</button>`; }
}
function gmClose() { show('modal', false); }

async function gmResolve(id) {
    try { await q(sb.from('dragon_flags').update({ resolved: true }).eq('id', id)); } catch (e) { alert('失敗：' + e.message); }
    gmLoad();
}

async function gmBan(uid, email) {
    const reason = prompt(`封鎖 ${email || uid}？\n請輸入原因（玩家看得到）：`, '存檔數值異常（改檔）');
    if (reason == null) return;
    try { await q(sb.from('dragon_bans').insert({ user_id: uid, email, reason: reason.slice(0, 200), by_email: me.email })); }
    catch (e) { alert('封鎖失敗：' + e.message); }
    gmClose(); gmLoad();
}

async function gmDelChat(id) {
    if (!confirm('刪除這則訊息？')) return;
    try { await q(sb.from('dragon_chat').delete().eq('id', id)); } catch (e) { alert('刪除失敗：' + e.message); }
    gmLoad();
}

async function gmMute(uid, email) {
    const h = prompt(`禁言 ${email || uid} 幾小時？（例如 1、24、168＝一週）`, '24');
    if (h == null) return;
    const hours = Math.max(0.1, Number(h) || 24);
    const reason = prompt('禁言原因（玩家看不到，自己記錄用）：', '不當發言') || '';
    try { await q(sb.from('dragon_mutes').upsert({ user_id: uid, email, reason: reason.slice(0, 200), until: new Date(Date.now() + hours * 3600e3).toISOString(), by_email: me.email })); }
    catch (e) { alert('禁言失敗：' + e.message); }
    gmLoad();
}

async function gmUnmute(uid) {
    try { await q(sb.from('dragon_mutes').delete().eq('user_id', uid)); } catch (e) { alert('解除失敗：' + e.message); }
    gmLoad();
}

async function gmUnban(uid) {
    if (!confirm('解除封鎖？')) return;
    try { await q(sb.from('dragon_bans').delete().eq('user_id', uid)); } catch (e) { alert('解除失敗：' + e.message); }
    gmClose(); gmLoad();
}

gmInit().catch(e => { document.getElementById('app').insertAdjacentHTML('beforeend', `<p class="bad">無法連線：${esc(e.message || e)}</p>`); });
</script>
</body>
</html>
