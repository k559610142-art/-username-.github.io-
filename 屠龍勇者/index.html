<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>屠龍勇者</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12100c">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="屠龍勇者">
<style>
    :root {
        --bg: #12100c; --panel: #1f1b15; --panel2: #2c261d; --line: #3d3427;
        --text: #efe6d2; --muted: #9d927d; --gold: #e8c066; --accent: #a8432e; --accent2: #c25a3c;
        --hp: #c8423a; --mp: #3d78c8; --exp: #d8b44a; --good: #7fc46a; --warn: #e0a64a; --bad: #e0605a;
        --rare: #c58cff; --ench: #ffd34d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: radial-gradient(ellipse at 50% -10%, #3a2a18, var(--bg) 65%) fixed;
        color: var(--text); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px;
    }
    #app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    button {
        font: inherit; color: var(--text); background: var(--accent); border: 1px solid #0003; border-radius: 8px;
        padding: 9px 12px; cursor: pointer; transition: filter .15s, transform .05s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: var(--panel2); border-color: var(--line); }
    button.danger { background: #6b1f1f; }
    button.mini { padding: 4px 9px; font-size: 13px; }
    input[type=number], input[type=text], input[type=password], textarea, .set-row select {
        font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    }
    input[type=number] { width: 70px; }
    .set-row select { max-width: 62%; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent2); }
    textarea { width: 100%; height: 120px; font-size: 12px; word-break: break-all; }
    h4 { margin: 14px 0 8px; color: var(--gold); }
    .panel h4 { margin-top: 0; }
    small { font-size: 12px; }
    .list-row small, .zone-card > small { display: block; }
    .muted { color: var(--muted); }
    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .hidden { display: none !important; }
    .clickable { cursor: pointer; }

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; flex: 1; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .notice { border-color: var(--warn); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .loc { font-weight: bold; font-size: 17px; color: var(--gold); }

    /* 標題 */
    #screen-title { align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 14px; }
    .logo { font-size: 80px; filter: drop-shadow(0 0 20px #c2433688); }
    #screen-title h1 { margin: 0; font-size: 46px; letter-spacing: 8px; color: var(--gold); text-shadow: 0 2px 0 #5a3a10, 0 0 24px #c2433688; }
    .subtitle { color: var(--muted); margin-top: -6px; }
    .title-btns { display: flex; flex-direction: column; gap: 10px; width: 240px; }
    .title-btns button { padding: 13px; font-size: 17px; }

    /* 人物選單（多角色欄位，ARCHITECTURE.md 第 25 節） */
    #app:has(#screen-select.active) { max-width: 1100px; }
    #screen-select { padding: 16px; gap: 10px; }
    .select-head { display: flex; align-items: baseline; justify-content: space-between; }
    .select-foot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(#0000, var(--bg) 30%); z-index: 2; }
    .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; background: #14131a; border: 2px solid #3b3a48; border-radius: 10px; box-shadow: inset 0 0 18px #000; }
    .char-card {
        position: relative; display: block; aspect-ratio: 9 / 16; max-height: 70vh; padding: 0; overflow: hidden; text-align: left;
        background: #1b1a24; border: 1px solid #2a2936; border-radius: 4px; color: #fff; font-weight: normal;
        text-shadow: 0 1px 2px #000, 0 0 4px #000;
    }
    .char-card.sel { border-color: #9fd8c8; box-shadow: 0 0 0 1px #9fd8c8, 0 0 14px #9fd8c866 inset; }
    .char-card.sel::after { content: ''; position: absolute; inset: 0; background: #7fc0b022; pointer-events: none; }
    .char-face { position: absolute; inset: 0; }
    .char-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
    .char-emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; background: radial-gradient(circle at 50% 45%, #3a3550, #15141c 70%); }
    .char-top, .char-bottom { position: absolute; left: 0; right: 0; padding: 6px 8px; }
    .char-top { top: 0; background: linear-gradient(#000d, #0008 70%, #0000); padding-bottom: 18px; }
    .char-bottom { bottom: 0; background: linear-gradient(#0000, #000a 25%, #000e); padding-top: 18px; }
    .char-name { font-size: 20px; color: #fff; }
    .char-card.sel .char-name { color: #f3e36a; }
    .char-cls { font-size: 17px; margin: 1px 0 3px; }
    .char-row, .char-bar { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; }
    .char-row i, .char-bar i { font-style: normal; color: #7fa8ff; }
    .char-bar { position: relative; margin-top: 3px; padding-bottom: 4px; }
    .char-bar > div { position: absolute; left: 0; bottom: 0; height: 5px; border-radius: 2px; }
    .char-bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 2px; background: #2b2f4a; }
    .char-bar i, .char-bar b { position: relative; }
    .char-bar.hp > div { background: linear-gradient(90deg, #e07a2a, #f3c24a); }
    .char-bar.mp > div { background: linear-gradient(90deg, #3a8ee0, #6ec6f6); }
    .char-loc { font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-card.empty, .char-card.broken { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 15px; border-style: dashed; border-color: #3b3a48; }
    .char-card.empty:hover { color: var(--gold); border-color: var(--gold); }
    .char-card small { font-size: 11px; color: #6c6a7a; }
    .char-plus { font-size: 40px; line-height: 1; }
    @media (max-width: 760px) {
        .char-grid { grid-template-columns: repeat(2, 1fr); }
        .char-name { font-size: 17px; } .char-cls, .char-row, .char-bar { font-size: 14px; }
    }

    /* 共鳴武器（ARCHITECTURE.md 第 27 節） */
    .res-box { margin: 6px 0; padding: 6px 8px; border-radius: 6px; border: 1px solid; background: #00000040; line-height: 1.5; }
    .res-box small { font-size: 11px; }
    .res-1 { color: #7fc8ff; border-color: #3d6f99; }
    .res-2 { color: #c99bff; border-color: #6a4a99; }
    .res-3 { color: #ffb257; border-color: #99652a; }
    .res-4 { color: #ff6b6b; border-color: #a33a3a; text-shadow: 0 0 6px #ff3b3b66; }
    .res-chip { border: 1px solid; background: #00000066; }

    /* 創角 */
    #screen-create { padding: 16px; gap: 10px; }
    .class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .class-card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; background: var(--panel2); font-size: 13px; }
    .class-card.active { background: var(--accent); }
    .class-icon { font-size: 24px; }
    #create-desc p { margin: 6px 0; }
    .class-art { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 30%; border-radius: 8px; margin-bottom: 8px; border: 1px solid #6a4a2a; }
    .stat-row { display: grid; grid-template-columns: 1fr auto 44px auto; align-items: center; gap: 8px; padding: 3px 0; }
    .stat-row b { text-align: center; font-size: 17px; }
    .points-left { text-align: right; margin-top: 6px; color: var(--gold); }

    /* 遊戲主畫面：外框（原圖座標 × --s） */
    body:has(#screen-game.active) { background: #050403; }
    #app:has(#screen-game.active) { max-width: none; }
    #screen-game { height: 100vh; height: 100dvh; align-items: center; justify-content: center; }
    #stage { display: flex; flex: none; position: relative; }
    #side {
        flex: none; height: 100%; overflow-y: auto; padding: 18px 22px 24px;
        background: linear-gradient(90deg, #0a0806, #1a1410 6%, #120e0b); border-left: 2px solid #5a4028;
        box-shadow: inset 8px 0 18px #000a;
    }
    #frame {
        --s: 0.28;
        position: relative; flex: none; width: 100%; height: 100%; overflow: hidden; background: #100c0a;
        border-style: solid; border-color: transparent; border-width: 0;
        border-image-source: url(images/frame.jpg?v=1);
        border-image-slice: 715 102 655 104 fill;
        border-image-width: calc(var(--s) * 715px) calc(var(--s) * 102px) calc(var(--s) * 655px) calc(var(--s) * 104px);
        border-image-repeat: stretch round;
    }
    /* 金幣、AC、MR：經驗條正上方，左右分在等級兩側（手機原圖 y 1712～1744；PC y 870～904） */
    .hud-stats {
        position: absolute; left: calc(var(--s) * 390px); right: calc(var(--s) * 390px); bottom: calc(var(--s) * 258px); height: calc(var(--s) * 32px);
        z-index: 3; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none;
        font-size: max(9px, calc(var(--s) * 22px)); font-weight: bold; color: #e8e0cc; white-space: nowrap;
    }
    .hud-stats span { padding: 0 5px; border-radius: 4px; background: #0c0806d9; text-shadow: 0 0 2px #000; line-height: 1.35; }
    .hud-stats .gold { color: var(--gold); }
    .hud-stats .hud-lv-gap { width: calc(var(--s) * 120px); padding: 0; background: none; }
    #panel {
        position: absolute; top: calc(var(--s) * 445px); left: calc(var(--s) * 112px); right: calc(var(--s) * 110px);
        bottom: calc(var(--s) * 626px); overflow-y: auto; padding: 4px 6px 10px;
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--gold); }
    #hud-bottom {
        position: absolute; left: calc(var(--s) * 214px); right: calc(var(--s) * 214px);
        bottom: calc(var(--s) * 420px); height: calc(var(--s) * 200px);
        display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 12px; text-shadow: 0 1px 3px #000;
    }
    .hud-where { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 經驗條（手機原圖 x 380～962、y 1746～1762；PC 原圖 x 300～1700、y 907～925）與等級（欄杆中間裝飾） */
    .exp-strip {
        position: absolute; left: calc(var(--s) * 380px); right: calc(var(--s) * 380px); bottom: calc(var(--s) * 238px);
        height: max(9px, calc(var(--s) * 18px)); z-index: 3; overflow: hidden; border-radius: 3px;
        background: #0c0806e6; border: 1px solid #a07a45; box-shadow: 0 0 4px #000;
    }
    .exp-fill { height: 100%; width: 0; background: linear-gradient(#f3d77a, #c9962f); transition: width .3s; }
    .exp-strip span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: max(8px, calc(var(--s) * 15px)); line-height: 1; color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000; white-space: nowrap; }
    .lv-badge {
        position: absolute; left: calc(var(--s) * 616px); width: calc(var(--s) * 110px); bottom: calc(var(--s) * 290px); height: calc(var(--s) * 50px);
        z-index: 3; display: flex; align-items: center; justify-content: center; pointer-events: none;
        font-weight: bold; font-size: max(10px, calc(var(--s) * 30px)); color: #ffe7a8; white-space: nowrap;
        background: radial-gradient(ellipse, #1a0e08f0 55%, #1a0e0800 100%); border-radius: 50%;
        text-shadow: 0 0 3px #000, 0 0 6px #d8a84a88;
    }
    .pillar {
        position: absolute; top: calc(var(--s) * 715px); bottom: calc(var(--s) * 655px); width: calc(var(--s) * 104px);
        background: transparent; border: 0; border-radius: 0; padding: 0; z-index: 4;
    }
    .pillar.left { left: 0; }
    .pillar.right { right: 0; width: calc(var(--s) * 102px); }
    .pillar::after {
        content: '❯'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #ff8a5a; font-size: 20px; text-shadow: 0 0 6px #ff3a1a, 0 0 14px #ff3a1a; animation: rune-pulse 2.2s ease-in-out infinite;
    }
    .pillar.right::after { content: '❮'; }
    .pillar.open::after { content: '✕'; animation: none; }
    .pillar:hover:not(:disabled) { filter: none; background: radial-gradient(ellipse at center, #ff3a1a22, transparent 70%); }
    @keyframes rune-pulse { 50% { opacity: .35; } }
    .drawer {
        position: absolute; top: calc(var(--s) * 760px); width: min(62%, 240px); z-index: 6; padding: 10px;
        display: flex; flex-direction: column; gap: 8px;
        background: linear-gradient(#2b2119, #120d0a); border: 1px solid #7a5530; box-shadow: 0 0 24px #000, inset 0 0 18px #0008;
        transition: transform .25s ease, visibility .25s;
        visibility: hidden;
    }
    .drawer.left { left: calc(var(--s) * 104px); border-radius: 0 12px 12px 0; transform: translateX(calc(-100% - var(--s) * 110px)); }
    .drawer.right { right: calc(var(--s) * 102px); border-radius: 12px 0 0 12px; transform: translateX(calc(100% + var(--s) * 110px)); }
    .drawer.open { transform: none; visibility: visible; }
    .drawer button { display: flex; align-items: center; gap: 10px; text-align: left; background: #3a2a1e; border: 1px solid #5a4028; padding: 11px 12px; }
    .drawer button span { font-size: 20px; }
    .drawer button.active { border-color: var(--gold); color: var(--gold); }
    .orb {
        position: absolute; bottom: calc(var(--s) * 112px); width: calc(var(--s) * 296px); height: calc(var(--s) * 296px);
        border-radius: 50%; background: transparent; border: 0; padding: 0; overflow: hidden; z-index: 3;
    }
    .orb.hp { left: calc(var(--s) * 82px); }
    .orb.mp { right: calc(var(--s) * 82px); }
    .orb:hover:not(:disabled) { filter: brightness(1.1); }
    .orb-empty { position: absolute; left: 0; right: 0; top: 0; height: 0; background: #000b; transition: height .3s; }
    .orb span {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
        font-size: 11px; font-weight: bold; line-height: 1.15; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 2px #000;
    }
    #slots { position: absolute; left: calc(var(--s) * 410px); bottom: calc(var(--s) * 158px); width: calc(var(--s) * 525px); height: calc(var(--s) * 77px); z-index: 3; }
    .slot {
        position: absolute; top: 0; width: calc(var(--s) * 77px); height: 100%; padding: 0; border: 0; border-radius: 3px;
        background: transparent; font-size: calc(var(--s) * 46px); line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .slot b { position: absolute; right: 1px; bottom: 0; font-size: 9px; line-height: 1; text-shadow: 0 0 2px #000, 0 0 3px #000; }
    .slot.active { box-shadow: 0 0 0 2px var(--gold), 0 0 8px var(--gold); }
    .slot.empty { opacity: .35; }
    /* 底部骷髏頭（原圖 x 610～730、y 1870～1990）：開始／停止掛機，眼睛表示狀態 */
    /* 技能快捷列（地圖右下）：冷卻用 conic 遮罩，MP 不足變暗 */
    .skill-bar { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 6px; z-index: 2; }
    .skill-bar .sk {
        position: relative; width: 44px; height: 44px; padding: 0; border-radius: 50%; overflow: hidden;
        background: radial-gradient(#4a2f1e, #1c120c); border: 2px solid #b8893c; color: #ffe7a8; box-shadow: 0 0 6px #000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
    }
    .skill-bar .sk::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
        background: conic-gradient(#000b var(--cd), #0000 0); }
    .skill-bar .sk.nomp { filter: grayscale(.8) brightness(.6); }
    .skill-bar .sk:active { transform: scale(.93); }
    .sk-n { font-size: 12px; font-weight: bold; }
    .sk-t { font-size: 8px; color: #ff9a3c; }
    .sk-k { position: absolute; right: 4px; top: 1px; font-size: 8px; color: #c8b896; }
    .sk-cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; font-size: 15px; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000; }
    .skull-hunt {
        position: absolute; left: calc(var(--s) * 610px); bottom: calc(var(--s) * 10px); width: calc(var(--s) * 120px); height: calc(var(--s) * 120px);
        padding: 0; border: 0; border-radius: 40%; background: transparent; z-index: 3; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .skull-hunt:hover:not(.on) .eye { box-shadow: 0 0 calc(var(--s) * 6px) #ff4a2a55; }
    .skull-hunt:active { transform: scale(.96); }
    .skull-hunt .eye {
        position: absolute; top: 46%; width: 22%; height: 17%; transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(#000 55%, #0000 75%); transition: background .3s, box-shadow .3s;
    }
    .skull-hunt .eye.l { left: 29%; }
    .skull-hunt .eye.r { left: 71%; }
    .skull-hunt.on .eye {
        background: radial-gradient(#ffd0a0 0, #ff3a1a 22%, #c00 48%, #6000 72%);
        box-shadow: 0 0 calc(var(--s) * 14px) calc(var(--s) * 3px) #ff1a0088; animation: skull-eye 1.6s ease-in-out infinite;
    }
    @keyframes skull-eye { 50% { filter: brightness(1.35); box-shadow: 0 0 calc(var(--s) * 22px) calc(var(--s) * 6px) #ff1a00aa; } }
    .title-badge { background: linear-gradient(90deg, #8a2d1f, #c8902c); color: #fff; font-size: 10px; padding: 0 5px; border-radius: 4px; margin-left: 4px; }
    .bar { position: relative; height: 18px; background: #0008; border-radius: 4px; overflow: hidden; font-size: 12px; border: 1px solid #0006; }
    .bar.thin { height: 4px; border: 0; }
    .bar-fill { height: 100%; transition: width .2s; }
    .bar span { position: absolute; inset: 0; text-align: center; line-height: 17px; text-shadow: 0 1px 2px #000; }
    .bar.hp .bar-fill { background: linear-gradient(#e0574d, var(--hp)); }
    .bar.mp .bar-fill { background: linear-gradient(#5591e0, var(--mp)); }
    .bar.exp .bar-fill { background: var(--exp); }
    .bar.wt .bar-fill { background: #8a7a55; }

    /* 狩獵：中間即時地圖（ui-scene.js） */
    .hunt-view { display: flex; flex-direction: column; height: 100%; gap: 6px; }
    .scene-wrap { position: relative; flex: 1 1 auto; min-height: 170px; border-radius: 8px; overflow: hidden; border: 1px solid #4a3a28; background: #000; }
    #scene-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scene-top { position: absolute; top: 5px; left: 8px; right: 8px; font-size: 12px; font-weight: bold; color: var(--gold); text-shadow: 0 1px 3px #000, 0 0 4px #000; pointer-events: none; }
    .scene-top small { color: var(--muted); font-weight: normal; }
    .scene-buffs { position: absolute; top: 24px; left: 6px; right: 6px; pointer-events: none; }
    .scene-buffs .chip { font-size: 11px; padding: 0 6px; background: #1d331dcc; }
    .scene-btns { margin-top: 0; gap: 6px; }
    .scene-btns button { padding: 6px 10px; font-size: 13px; }
    .hunt-view .session { margin-bottom: 0; font-size: 11px; }
    .hunt-ctrl { flex: none; display: flex; flex-direction: column; gap: 6px; }

    /* ── PC 橫式外框（#frame.pc；位置＝原圖 2000×1116 座標 × --s，見 ARCHITECTURE.md 第 19 節）── */
    #frame-art, #overlay { display: none; }
    #frame.pc { border-image: none; background: #000; }
    #frame.pc #frame-art {
        display: block; position: absolute; inset: 0; z-index: 2; pointer-events: none;
        /* frame-pc-slim：上方拱門縮到 74% 高（0～475 → 0～350），下接兩段柱子雕花，地圖多露出約 120px（第 19 節） */
        background: url(images/frame-pc-slim.jpg?v=1) center / 100% 100% no-repeat;
        -webkit-mask: url(images/frame-pc-slim-mask.png?v=1) center / 100% 100% no-repeat;
        mask: url(images/frame-pc-slim-mask.png?v=1) center / 100% 100% no-repeat;
    }
    #frame.pc .pillar, #frame.pc .drawer { display: none; }
    #frame.pc #panel { left: calc(var(--s) * 92px); right: calc(var(--s) * 92px); top: calc(var(--s) * 108px); bottom: calc(var(--s) * 278px); padding: 0; overflow: hidden; z-index: 1; }

    #frame.pc .scene-top { left: calc(var(--s) * 100px); top: calc(var(--s) * 170px); font-size: 14px; }
    #frame.pc .scene-buffs { left: calc(var(--s) * 100px); top: calc(var(--s) * 205px); right: auto; width: calc(var(--s) * 500px); }
    /* PC：不畫操作框（功能都在底部格子），只剩永夜之塔上下樓／取消步行時浮在地圖左上（地點名稱下方） */
    #frame.pc .hunt-ctrl { position: absolute; left: calc(var(--s) * 100px); top: calc(var(--s) * 300px); padding: 0; background: none; border: 0; z-index: 1; }
    #frame.pc .hunt-ctrl.empty, #frame.pc #hunt-session { display: none; }
    #frame.pc .hud-stats { left: calc(var(--s) * 320px); right: calc(var(--s) * 320px); bottom: calc(var(--s) * 212px); height: calc(var(--s) * 34px); }
    #frame.pc .hud-lv-gap { width: calc(var(--s) * 140px); }
    #frame.pc .exp-strip { left: calc(var(--s) * 300px); right: calc(var(--s) * 300px); bottom: calc(var(--s) * 191px); height: max(10px, calc(var(--s) * 18px)); }
    #frame.pc .lv-badge { left: calc(var(--s) * 940px); width: calc(var(--s) * 120px); bottom: calc(var(--s) * 222px); height: calc(var(--s) * 46px); }
    #frame.pc #hud-bottom { left: calc(var(--s) * 720px); right: calc(var(--s) * 720px); bottom: calc(var(--s) * 300px); height: calc(var(--s) * 70px); z-index: 3; justify-content: flex-start; }

    #frame.pc #slots { left: 0; top: 0; width: 100%; height: 100%; bottom: auto; pointer-events: none; }
    #frame.pc .slot { pointer-events: auto; font-size: calc(var(--s) * 34px); }
    #frame.pc .slot.side { background: #1a1410d9; border: 1px solid #5a4028; border-radius: 50%; box-shadow: 0 0 8px #000a; }
    #frame.pc .slot.side.active { border-color: var(--gold); }
    #frame.pc .slot.round { border-radius: 50%; }
    #frame.pc .skill-bar { right: calc(var(--s) * 250px); bottom: calc(var(--s) * 40px); gap: 10px; }
    #frame.pc .skill-bar .sk { width: 52px; height: 52px; }
    #frame.pc .skull-hunt { left: calc(var(--s) * 950px); bottom: calc(var(--s) * 6px); width: calc(var(--s) * 100px); height: calc(var(--s) * 100px); }
    #frame.pc .skull-hunt .eye { top: 43%; width: 20%; height: 15%; }
    #frame.pc .skull-hunt .eye.l { left: 33%; }
    #frame.pc .skull-hunt .eye.r { left: 67%; }
    #frame.pc .slot b { font-size: 10px; }
    #frame.pc #overlay {
        display: block; position: absolute; z-index: 4; overflow-y: auto;
        left: calc(var(--s) * 1120px); right: calc(var(--s) * 120px); top: calc(var(--s) * 300px); bottom: calc(var(--s) * 300px);
        padding: 10px 12px; background: #120e0bf2; border: 1px solid #8a6a3a; border-radius: 10px; box-shadow: 0 0 24px #000;
    }
    #frame.pc #overlay.hidden { display: none; }
    /* 戰鬥訊息抽屜：左下骷髏頭（原圖 x 15～120、y 1870～1985）開關，抽屜蓋在地圖下緣、從下往上滑出 */
    .skull-log {
        position: absolute; left: calc(var(--s) * 15px); bottom: calc(var(--s) * 15px); width: calc(var(--s) * 105px); height: calc(var(--s) * 115px);
        padding: 0; border: 0; border-radius: 40%; background: transparent; z-index: 3; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .skull-log span {
        position: absolute; right: -4px; bottom: 0; font-size: 12px; line-height: 1; padding: 2px; border-radius: 4px;
        background: #000b; border: 1px solid #5a4028; transition: box-shadow .2s, border-color .2s;
    }
    .skull-log:active { transform: scale(.96); }
    .skull-log.open span { border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }
    .log-pop {
        position: absolute; left: calc(var(--s) * 124px); right: calc(var(--s) * 124px); bottom: calc(var(--s) * 636px);
        height: calc(var(--s) * 430px); min-height: 110px; z-index: 4; display: flex; flex-direction: column;
        background: #0b0807eb; border: 1px solid #7a5530; border-radius: 8px 8px 0 0; box-shadow: 0 -4px 16px #000c;
        transform: translateY(16px); opacity: 0; visibility: hidden; transition: transform .2s, opacity .2s, visibility .2s;
    }
    .log-pop.open { transform: none; opacity: 1; visibility: visible; }
    .log-pop-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-size: 12px; color: var(--gold); border-bottom: 1px solid #3a2a1e; }
    .log-pop-head button { padding: 1px 8px; }
    .lp-tabs { display: flex; gap: 4px; }
    .log-pop-head .lp-tab { background: transparent; border: 1px solid transparent; color: var(--muted); font-size: 12px; padding: 1px 8px; }
    .log-pop-head .lp-tab.on { color: var(--gold); border-color: #5a4028; background: #3a2a1e; }
    .pop-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 4px 6px 6px; }
    .pop-chat .chips { gap: 4px; }
    .pop-chat .chip-btn { padding: 1px 8px; font-size: 11px; }
    .pop-chat .chat-list { flex: 1; height: auto; min-height: 0; font-size: 12px; padding: 4px 6px; }
    .pop-chat .chat-input-row input { font-size: 13px; padding: 4px 6px; }
    .pop-chat .chat-input-row button { padding: 3px 10px; font-size: 13px; }
    .pop-chat .muted { font-size: 12px; }
    .log-pop .log { flex: 1; height: auto; min-height: 0; overflow-y: auto; font-size: 12px; line-height: 1.4; padding: 4px 8px; margin: 0; border: 0; background: transparent; }
    #frame.pc .skull-log { left: calc(var(--s) * 5px); bottom: calc(var(--s) * 6px); width: calc(var(--s) * 95px); height: calc(var(--s) * 100px); }
    #frame.pc .log-pop { left: calc(var(--s) * 92px); right: auto; width: calc(var(--s) * 760px); bottom: calc(var(--s) * 290px); height: calc(var(--s) * 330px); }
    /* 狩獵（舊） */
    .mon-card { display: flex; align-items: center; gap: 12px; min-height: 76px; }
    .mon-icon { font-size: 44px; width: 56px; text-align: center; animation: bob 1.6s ease-in-out infinite; }
    .mon-icon.boss { font-size: 52px; filter: drop-shadow(0 0 10px var(--hp)); }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    .mon-info { flex: 1; display: grid; gap: 4px; }
    .mon-wait { color: var(--muted); width: 100%; text-align: center; }
    .buffs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .chip { background: #2a4a2a; border: 1px solid #3f6a3f; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .session { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: grid; gap: 2px; }
    .log { height: 300px; overflow-y: auto; font-size: 13px; line-height: 1.5; padding: 8px 10px; background: #0007; }
    .log-line.miss { color: #8a8070; }
    .log-line.hurt { color: #ff8f80; }
    .log-line.heal { color: #8fd0ff; }
    .log-line.magic { color: #b9a6ff; }
    .log-line.crit { color: var(--ench); }
    .log-line.win { color: var(--good); }
    .log-line.loot { color: #d8cfa8; }
    .log-line.rare { color: var(--rare); font-weight: bold; }
    .log-line.lvup { color: var(--gold); font-weight: bold; }
    .log-line.boss, .log-line.dead { color: var(--bad); font-weight: bold; }
    .log-line.warn { color: var(--warn); }
    .log-line.sys { color: #9fc8c0; }

    /* 地圖 */
    .zone-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .zone-card.dragon { border-color: #6b2a20; background: linear-gradient(90deg, #2e1510, var(--panel)); }
    .zone-card.tower { border-color: #5a4a2a; }
    .zone-head { display: flex; align-items: center; gap: 8px; }
    .zone-head small { margin-left: auto; }
    .zone-icon { font-size: 22px; }
    .zone-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .tower-pick { font-size: 13px; }

    /* 角色 */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-cell { background: var(--panel2); border-radius: 6px; padding: 6px 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .stat-cell span { color: var(--muted); font-size: 13px; }
    .stat-cell b { font-size: 17px; }
    .kv-grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 10px; font-size: 14px; }
    .kv-grid span { color: var(--muted); }
    .equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .equip-slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font-size: 13px; text-align: left; display: flex; flex-direction: column; min-height: 48px; }
    .equip-slot small { color: var(--muted); }
    .equip-slot.filled { border-color: #6a5a3a; }
    .exp-line { margin-top: 6px; font-size: 13px; }
    .dragon-list { line-height: 1.8; margin: 8px 0 0; }

    /* 背包、清單 */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip-btn { background: var(--panel2); border-color: var(--line); padding: 5px 12px; border-radius: 16px; font-size: 13px; }
    .chip-btn.active { background: var(--accent); }
    .list { display: grid; gap: 5px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; }
    .list-row.locked { opacity: .5; }
    .list-row > div:first-child { min-width: 0; }
    /* 裝備圖鑑（codex.js）：品質顏色、上方詳細、下方清單 */
    .g-normal { color: #e8e0cc; } .g-high { color: #7fd36a; } .g-rare { color: #5fa8ff; } .g-hero { color: #c07bff; } .g-legend { color: #ff9a3c; }
    .codex-top { padding-bottom: 6px; }
    .codex-top .chips { margin-bottom: 6px; gap: 4px; }
    .codex-top .chip-btn { padding: 4px 10px; font-size: 12px; }
    .codex-filter { display: flex; gap: 6px; }
    .codex-filter input { flex: 1; min-width: 0; padding: 6px 8px; background: #0008; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
    .codex-filter select { padding: 6px; background: #0008; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
    .codex-box { position: sticky; top: 0; z-index: 2; margin-bottom: 6px; box-shadow: 0 6px 12px #000c; background: radial-gradient(ellipse at 20% 30%, #2a2030, #120e0b 70%); border-color: #7a5530; }
    .codex-pop { position: relative; line-height: 1.5; }
    .codex-close { position: absolute; top: 0; right: 0; z-index: 1; padding: 2px 9px; font-size: 13px; }
    .codex-pop .codex-detail { padding-right: 34px; }
    .codex-detail { display: flex; gap: 12px; align-items: center; }
    .codex-art { flex: none; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 36px;
        border: 1px solid currentColor; border-radius: 10px; background: radial-gradient(#ffffff14, #0000 70%); box-shadow: inset 0 0 14px #000, 0 0 10px currentColor; }
    .codex-art.g-normal { box-shadow: inset 0 0 14px #000; }
    .codex-name { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
    .codex-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; margin-top: 3px; }
    .codex-grade { padding: 1px 8px; border: 1px solid currentColor; border-radius: 4px; background: #0006; }
    .codex-cls { font-size: 12px; color: var(--warn); margin-top: 3px; }
    .codex-sec { margin: 8px 0 4px; padding: 3px 8px; font-size: 13px; color: var(--gold); background: linear-gradient(90deg, #3a2a1e, #0000); border-left: 2px solid var(--gold); }
    .codex-stats { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; font-size: 12px; padding: 0 8px; }
    .codex-desc { margin-top: 8px; font-size: 12px; color: #d8cfa8; padding: 0 8px; }
    .codex-src { font-size: 12px; line-height: 1.6; padding: 0 8px; }
    .codex-head, .codex-row { display: grid; grid-template-columns: 30px 1fr 44px 76px; gap: 6px; align-items: center; }
    .codex-head { font-size: 11px; color: var(--muted); padding: 0 8px 4px; border-bottom: 1px solid var(--line); }
    .codex-list { display: grid; gap: 3px; margin-top: 4px; }
    .codex-row { padding: 5px 8px; text-align: left; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .codex-row.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 8px #d8a84a55; background: #3a2a1e; }
    .codex-row:not(.owned) .codex-ico { filter: grayscale(.6) brightness(.8); }
    .codex-ico { font-size: 18px; text-align: center; }
    .codex-n { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .codex-row > span:last-child { font-size: 11px; }
    .codex-foot { font-size: 12px; text-align: center; margin: 8px 0 4px; }
    .item-row { display: flex; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); text-align: left; }
    .qty-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .ench-hi { color: var(--ench); font-weight: bold; }
    .rare-item { color: var(--rare); }
    /* 通貨改造視窗、地圖詞綴 */
    /* 裝備比較（背包裝備 vs 裝備中） */
    .cmp-box { margin-top: 10px; padding: 8px 10px; background: #0006; border: 1px solid #7a5530; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .cmp-box > b { color: var(--gold); }
    .cmp-tbl { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 12px; }
    .cmp-tbl th { text-align: left; color: var(--muted); font-weight: normal; border-bottom: 1px solid var(--line); padding: 2px 4px; }
    .cmp-tbl td { padding: 2px 4px; border-bottom: 1px dashed #3a2a1e; white-space: nowrap; }
    .cmp-tbl td:first-child { white-space: normal; }
    .cmp-old summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
    .cmp-old { font-size: 12px; }
    .craft-item { padding: 8px 10px; margin-bottom: 8px; background: #0006; border: 1px solid var(--line); border-radius: 8px; }
    .craft-list { display: grid; gap: 5px; }
    .craft-cur { display: grid; grid-template-columns: 26px 1fr; grid-template-rows: auto auto; column-gap: 6px; text-align: left; padding: 6px 8px; background: var(--panel2); border: 1px solid #7a5530; }
    .craft-cur .cc-i { grid-row: span 2; font-size: 20px; align-self: center; }
    .craft-cur .cc-n { font-weight: bold; color: #ffe7a8; } .craft-cur .cc-n b { color: var(--muted); font-weight: normal; }
    .craft-cur small { color: var(--muted); font-size: 11px; }
    .craft-cur.off { opacity: .45; }
    .map-prog { margin-left: 6px; color: #ff9a6a; font-size: 12px; text-shadow: 0 0 3px #000; }
    .map-run { padding: 8px 10px; margin-bottom: 8px; background: #3a1712; border: 1px solid #c0392b; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .map-mods h4 small { margin-left: 6px; font-weight: normal; }
    .mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .mod-chip { position: relative; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 6px 8px; background: var(--panel2); border: 1px solid var(--line); }
    .mod-chip small { color: var(--muted); font-size: 11px; line-height: 1.3; }
    .mod-chip span { position: absolute; right: 6px; top: 5px; font-size: 11px; color: var(--good); }
    .mod-chip.on { border-color: #c0392b; background: #3a1712; box-shadow: 0 0 8px #c0392b88 inset; }
    .q-magic { color: #6aa8ff; } .q-rare { color: #ffd84a; } .q-legend { color: #ff8c2a; font-weight: bold; text-shadow: 0 0 6px #ff6a0066; }
    .cursed { color: var(--bad); }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .set-row:last-of-type { border-bottom: 0; }

    /* 職業任務 */
    .story p, .story-text { line-height: 1.7; }
    .story-text { color: #d8cfb8; font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; border-radius: 0; }
    .quest-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .quest-card.current { border-color: var(--gold); }
    .quest-card.done { opacity: .75; }
    .quest-card.locked { opacity: .45; }
    .quest-card p { margin: 6px 0; line-height: 1.7; }
    .quest-head { display: flex; justify-content: space-between; align-items: center; }
    .quest-goal { color: var(--gold); margin: 6px 0 2px; }
    .quest-act { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .quest-act .bar { flex: 1; min-width: 160px; }

    /* 對話框、提示 */
    #dialog-layer { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    #dialog-layer.active { display: flex; }
    .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 100%; max-width: 440px; max-height: 86vh; display: flex; flex-direction: column; }
    .dialog h3 { margin: 0 0 10px; color: var(--gold); }
    .dialog-body { overflow-y: auto; line-height: 1.7; }
    .dialog-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #toast-layer { position: fixed; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; }
    .toast { background: #000e; border: 1px solid var(--line); padding: 8px 16px; border-radius: 20px; animation: toast-in .2s; max-width: 90%; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
    #pwa-update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; background: var(--gold); color: #2a1a05; font-weight: bold; border-radius: 20px; padding: 10px 18px; }

    @media (max-width: 420px) {
        .class-grid { grid-template-columns: repeat(4, 1fr); }
        .class-card { font-size: 11px; }
        .kv-grid { grid-template-columns: auto 1fr; }
        .stat-grid, .equip-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* 帳號登入／雲端存檔（cloud.js，ARCHITECTURE.md 第 29 節） */
    .cloud-field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
    .cloud-field input { width: 100%; box-sizing: border-box; }
    .cloud-msg { min-height: 1.4em; font-size: 14px; color: var(--gold); }
    .cloud-msg.bad { color: #ff8a7a; }

    /* 團隊副本（raid.js，ARCHITECTURE.md 第 30 節） */
    .raid-pick { border-color: var(--gold); }
    .raid-code { font-size: 18px; margin: 4px 0 6px; }
    .raid-code b { font-size: 26px; letter-spacing: 4px; color: var(--gold); user-select: all; }
    .raid-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .raid-slot { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); font-size: 13px; }
    .raid-slot.ready { border-color: var(--good); }
    .raid-slot.empty { color: var(--muted); justify-content: center; text-align: center; border-style: dashed; }
    .raid-mems { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .raid-mem { font-size: 13px; }
    .raid-mem.me span { color: var(--gold); }
    .raid-mem.down { opacity: .45; }
    .raid-bar { position: relative; height: 16px; background: #000a; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 2px; }
    .raid-bar > div { height: 100%; background: var(--hp, #b8322a); transition: width .4s; }
    .raid-bar.boss { height: 22px; }
    .raid-bar.boss > div { background: linear-gradient(90deg, #7a1c12, #d0482c); }
    .raid-bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: normal; text-shadow: 0 1px 2px #000; }
    .raid-log { max-height: 260px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
    @media (max-width: 420px) { .raid-slots, .raid-mems { grid-template-columns: 1fr; } }

    /* 聊天（chat.js，ARCHITECTURE.md 第 32 節） */
    .chat-panel { display: flex; flex-direction: column; gap: 8px; }
    .chat-list { height: 34vh; min-height: 160px; overflow-y: auto; background: #0007; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; line-height: 1.5; }
    .chat-line { padding: 2px 0; word-break: break-word; }
    .chat-time { color: var(--muted); font-size: 11px; margin-right: 6px; }
    .chat-name { color: #9fc8c0; font-weight: normal; margin-right: 6px; }
    .chat-name small { color: var(--muted); }
    .chat-line.mine .chat-name { color: var(--gold); }
    .chat-input-row { display: flex; gap: 6px; }
    .chat-input-row input { flex: 1; min-width: 0; }

    /* 血盟（clan.js，ARCHITECTURE.md 第 33 節） */
    .clan-title { font-size: 22px; color: var(--gold); }
    .clan-form { display: flex; flex-direction: column; gap: 8px; }
    .list-row.clan-me { border-color: var(--gold); }

    /* 排行榜（rank.js，ARCHITECTURE.md 第 34 節） */
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
    .rank-row { justify-content: flex-start; }
    .rank-row > div { flex: 1; min-width: 0; }
    .rank-no { width: 34px; text-align: center; font-size: 16px; color: var(--gold); font-variant-numeric: tabular-nums; flex: none; }
    .rank-val { flex: none; color: var(--gold); font-variant-numeric: tabular-nums; }
    .list-row.rank-me { border-color: var(--gold); background: #3a2a1e; }
</style>
</head>
<body>
<div id="app">
    <!-- 標題 -->
    <section id="screen-title" class="screen">
        <div class="logo">🐉</div>
        <h1>屠龍勇者</h1>
        <div class="subtitle">四大龍甦醒，黑暗大陸等待勇者</div>
        <div class="title-btns">
            <button id="btn-continue" onclick="continueGame()">📜 繼續冒險</button>
            <button id="btn-select" class="secondary" onclick="openCharSelect()">👥 人物選單</button>
            <button id="btn-new" class="secondary" onclick="openCreate()">⚔️ 建立新角色</button>
            <button id="btn-cloud" class="secondary hidden" onclick="openCloudDialog()">☁️ 登入／註冊</button>
            <button class="secondary" onclick="openInstallGuide()">📲 安裝到主畫面</button>
        </div>
        <small id="version" class="muted"></small>
    </section>

    <!-- 人物選單：多角色欄位（ARCHITECTURE.md 第 25 節） -->
    <section id="screen-select" class="screen">
        <div class="select-head"><div class="loc">👥 人物選單</div><small id="select-count" class="muted"></small></div>
        <div id="char-grid" class="char-grid"></div>
        <small id="select-hint" class="muted"></small>
        <div class="btn-row select-foot">
            <button class="secondary" onclick="showTitle()">返回</button>
            <button id="btn-delchar" class="danger" onclick="deleteSelectedChar()">🗑 刪除</button>
            <button id="btn-play" onclick="playSelected()" style="flex:1">▶ 進入遊戲</button>
        </div>
    </section>

    <!-- 創角 -->
    <section id="screen-create" class="screen">
        <div class="loc">建立角色</div>
        <div id="create-classes" class="class-grid"></div>
        <div id="create-desc" class="panel"></div>
        <div class="panel">
            <h4>能力值分配 <small class="muted">（總點數 75，單項最高 18）</small></h4>
            <div id="create-stats"></div>
        </div>
        <div class="panel">
            <input id="create-name" type="text" maxlength="12" placeholder="角色名稱" style="width:100%">
        </div>
        <div class="btn-row">
            <button class="secondary" onclick="createBack()">返回</button>
            <button onclick="confirmCreate()" style="flex:1">✅ 建立角色</button>
        </div>
    </section>

    <!-- 遊戲 -->
    <section id="screen-game" class="screen">
        <!-- 外框（images/frame.jpg 九宮格），位置見 ARCHITECTURE.md 第 15 節 -->
        <div id="stage">
        <div id="frame">
            <main id="panel"></main>
            <!-- PC 橫式外框：外框圖蓋在地圖上（窗口用遮罩挖空）；其他分頁開在 #overlay 視窗 -->
            <div id="frame-art"></div>
            <div id="overlay" class="hidden"></div>
            <div id="hud-bottom"></div>
            <!-- 經驗條：欄杆下緣與底部格子之間的石條；等級：欄杆正中間的裝飾（ARCHITECTURE.md 第 15、19 節） -->
            <div id="exp-strip" class="exp-strip"><div class="exp-fill"></div><span></span></div>
            <div id="lv-badge" class="lv-badge"></div>
            <div id="hud-stats" class="hud-stats"></div>
            <button id="pillar-left" class="pillar left" onclick="toggleDrawer('left')" aria-label="角色選單"></button>
            <button id="pillar-right" class="pillar right" onclick="toggleDrawer('right')" aria-label="系統選單"></button>
            <div id="drawer-left" class="drawer left"></div>
            <div id="drawer-right" class="drawer right"></div>
            <button id="orb-hp" class="orb hp" onclick="orbHpClick()" aria-label="HP，點一下喝治癒藥水"><div class="orb-empty"></div><span></span></button>
            <button id="orb-mp" class="orb mp" onclick="orbMpClick()" aria-label="MP，點一下喝藍色藥水"><div class="orb-empty"></div><span></span></button>
            <div id="slots"></div>
            <!-- 底部中間骷髏頭＝開始／停止掛機：眼睛黑＝沒在掛機、紅光＝掛機中（ARCHITECTURE.md 第 15 節） -->
            <!-- 左下（紅球下方）骷髏頭＝戰鬥訊息抽屜開關；抽屜從下往上滑出 -->
            <button id="skull-log" class="skull-log" onclick="toggleLogDrawer()" title="戰鬥訊息" aria-label="戰鬥訊息"><span>📜</span></button>
            <div id="log-pop" class="log-pop"><div class="log-pop-head"><span class="lp-tabs"><button id="lp-tab-log" class="lp-tab on" onclick="setLogPopTab('log')">📜 戰鬥訊息</button><button id="lp-tab-chat" class="lp-tab" onclick="setLogPopTab('chat')">💬 聊天</button></span><button class="mini secondary" onclick="toggleLogDrawer()">✕</button></div><div id="hunt-log" class="log"></div><div id="pop-chat" class="pop-chat hidden"></div></div>
            <button id="skull-hunt" class="skull-hunt" onclick="skullHuntClick()" aria-label="開始掛機"><i class="eye l"></i><i class="eye r"></i></button>
        </div>
        <!-- PC 16:9 版面的右側欄（其他分頁顯示在這裡） -->
        <aside id="side" class="hidden"></aside>
        </div>
    </section>
</div>

<div id="dialog-layer"></div>
<div id="toast-layer"></div>
