<style>
    :root {
        --bg: #12100c; --panel: #1f1b15; --panel2: #2c261d; --line: #3d3427;
        --text: #efe6d2; --muted: #9d927d; --gold: #e8c066; --accent: #a8432e; --accent2: #c25a3c;
        --hp: #c8423a; --mp: #3d78c8; --exp: #d8b44a; --good: #7fc46a; --warn: #e0a64a; --bad: #e0605a;
        --rare: #c58cff; --ench: #ffd34d;
    }
    * { box-sizing: border-box; }
    /* 關閉下拉重新整理、雙擊與雙指縮放，保留面板內水平／垂直捲動。 */
    html, body { margin: 0; height: 100%; overscroll-behavior: none; touch-action: pan-x pan-y; }
    #panel, .pane, .dialog-body, .log, .chat-list, .buffs.scene-buffs { overscroll-behavior: none; }
    body {
        background: radial-gradient(ellipse at 50% -10%, #3a2a18, var(--bg) 65%) fixed;
        color: var(--text); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px;
    }
    #app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    button {
        font: inherit; color: var(--text); background: var(--accent); border: 1px solid #0003; border-radius: 8px;
        padding: 9px 12px; cursor: pointer; transition: filter .15s, transform .05s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: var(--panel2); border-color: var(--line); }
    button.danger { background: #6b1f1f; }
    button.mini { padding: 4px 9px; font-size: 13px; }
    input[type=number], input[type=text], input[type=password], textarea, .set-row select {
        font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    }
    input[type=number] { width: 70px; }
    .set-row select { max-width: 62%; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent2); }
    textarea { width: 100%; height: 120px; font-size: 12px; word-break: break-all; }
    h4 { margin: 14px 0 8px; color: var(--gold); }
    .panel h4 { margin-top: 0; }
    small { font-size: 12px; }
    .list-row small, .zone-card > small { display: block; }
    .muted { color: var(--muted); }
    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .hidden { display: none !important; }
    .clickable { cursor: pointer; }

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; flex: 1; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .notice { border-color: var(--warn); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .loc { font-weight: bold; font-size: 17px; color: var(--gold); }

    /* 標題 */
    /* 標題畫面＝使用者提供的「黑暗大陸」封面（images/cover.jpg，1000×1490，圖上已有標題字）；按鈕疊在下方 */
    #screen-title { align-items: center; justify-content: flex-end; text-align: center; padding: 24px 16px calc(20px + env(safe-area-inset-bottom)); gap: 10px;
        background: url(images/cover.jpg?v=20261028p) center top / contain no-repeat, #000; }   /* contain：整張封面一定看得到（2026-10-12 使用者回報人物被裁掉） */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .title-btns { display: flex; flex-direction: column; gap: 10px; width: 240px; }
    .title-btns button { padding: 13px; font-size: 17px; }
    #screen-title .title-btns button.secondary { background: #1c1410cc; backdrop-filter: blur(2px); }
    /* PC（橫向寬螢幕）：按鈕改成小顆橫排，放在封面最下方，不擋封面（2026-10-12 使用者要求） */
    @media (orientation: landscape) and (min-width: 700px) {
        #screen-title { gap: 6px; padding-bottom: 14px; }
        #screen-title .title-btns { flex-direction: row; flex-wrap: wrap; justify-content: center; width: auto; max-width: 92%; gap: 8px; }
        #screen-title .title-btns button { padding: 7px 14px; font-size: 14px; }
        #screen-title .title-btns button small { font-size: 11px; }
        #screen-title .test-notice { max-width: 460px; padding: 4px 10px; font-size: 12px; }
    }
    /* 矮的直向手機：按鈕縮小，少擋封面人物 */
    @media (orientation: portrait) and (max-height: 780px) {
        #screen-title { gap: 6px; }
        #screen-title .title-btns { gap: 6px; }
        #screen-title .title-btns button { padding: 7px; font-size: 15px; }
        #screen-title .test-notice { padding: 4px 10px; font-size: 12px; }
    }
    .test-notice { max-width: 320px; padding: 8px 12px; border: 1px solid #8a6a3a; border-radius: 8px; background: #2a1d10cc; color: #f3d48a; font-size: 13px; line-height: 1.5; }

    /* 人物選單（多角色欄位，ARCHITECTURE.md 第 25 節） */
    #app:has(#screen-select.active) { max-width: 1100px; }
    #screen-select { padding: 16px; gap: 10px; }
    .select-head { display: flex; align-items: baseline; justify-content: space-between; }
    .select-foot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(#0000, var(--bg) 30%); z-index: 2; }
    .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; background: #14131a; border: 2px solid #3b3a48; border-radius: 10px; box-shadow: inset 0 0 18px #000; }
    .char-card {
        position: relative; display: block; aspect-ratio: 9 / 16; max-height: 70vh; padding: 0; overflow: hidden; text-align: left;
        background: #1b1a24; border: 1px solid #2a2936; border-radius: 4px; color: #fff; font-weight: normal;
        text-shadow: 0 1px 2px #000, 0 0 4px #000;
    }
    .char-card.sel { border-color: #9fd8c8; box-shadow: 0 0 0 1px #9fd8c8, 0 0 14px #9fd8c866 inset; }
    .char-card.sel::after { content: ''; position: absolute; inset: 0; background: #7fc0b022; pointer-events: none; }
    .char-face { position: absolute; inset: 0; }
    .char-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
    .char-emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; background: radial-gradient(circle at 50% 45%, #3a3550, #15141c 70%); }
    .char-top, .char-bottom { position: absolute; left: 0; right: 0; padding: 6px 8px; }
    .char-top { top: 0; background: linear-gradient(#000d, #0008 70%, #0000); padding-bottom: 18px; }
    .char-bottom { bottom: 0; background: linear-gradient(#0000, #000a 25%, #000e); padding-top: 18px; }
    .char-name { font-size: 20px; color: #fff; }
    .char-card.sel .char-name { color: #f3e36a; }
    .char-cls { font-size: 17px; margin: 1px 0 3px; }
    .char-row, .char-bar { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; }
    .char-row i, .char-bar i { font-style: normal; color: #7fa8ff; }
    .char-bar { position: relative; margin-top: 3px; padding-bottom: 4px; }
    .char-bar > div { position: absolute; left: 0; bottom: 0; height: 5px; border-radius: 2px; }
    .char-bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 2px; background: #2b2f4a; }
    .char-bar i, .char-bar b { position: relative; }
    .char-bar.hp > div { background: linear-gradient(90deg, #e07a2a, #f3c24a); }
    .char-bar.mp > div { background: linear-gradient(90deg, #3a8ee0, #6ec6f6); }
    .char-loc { font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-card.empty, .char-card.broken { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 15px; border-style: dashed; border-color: #3b3a48; }
    .char-card.empty:hover { color: var(--gold); border-color: var(--gold); }
    .char-card small { font-size: 11px; color: #6c6a7a; }
    .char-plus { font-size: 40px; line-height: 1; }
    @media (max-width: 760px) {
        .char-grid { grid-template-columns: repeat(2, 1fr); }
        .char-name { font-size: 17px; } .char-cls, .char-row, .char-bar { font-size: 14px; }
    }

    /* 共鳴武器（ARCHITECTURE.md 第 27 節） */
    .res-box { margin: 6px 0; padding: 6px 8px; border-radius: 6px; border: 1px solid; background: #00000040; line-height: 1.5; }
    .res-box small { font-size: 11px; }
    .res-1 { color: #7fc8ff; border-color: #3d6f99; }
    .res-2 { color: #c99bff; border-color: #6a4a99; }
    .res-3 { color: #ffb257; border-color: #99652a; }
    .res-4 { color: #ff6b6b; border-color: #a33a3a; text-shadow: 0 0 6px #ff3b3b66; }
    .res-chip { border: 1px solid; background: #00000066; }

    /* 創角 */
    #screen-create { padding: 16px; gap: 10px; }
    .class-icon { font-size: 24px; }
    #create-desc p { margin: 6px 0; }
    /* 創角舞台：合照變暗，選中的職業（去背圖）放大走出來 */
    .class-stage { position: relative; width: 100%; aspect-ratio: 2000 / 1493; border-radius: 8px; margin-bottom: 8px; border: 1px solid #6a4a2a; overflow: hidden; background: #0d0b10; }
    .class-stage .stage-bg { position: absolute; inset: 0; width: 100%; height: 100%; filter: brightness(.38) saturate(.75); }
    .class-stage .stage-pick { position: absolute; pointer-events: none; z-index: 1; filter: drop-shadow(0 0 5px rgba(255, 210, 140, .5)) brightness(1.05); }
    .class-stage .stage-pick.step { animation: stagePick .5s ease-out; }
    @keyframes stagePick { from { opacity: 0; } }
    .class-stage .stage-front { position: absolute; pointer-events: none; z-index: 3; transform-origin: 50% 100%;
        filter: drop-shadow(0 0 14px rgba(255, 200, 120, .45)) drop-shadow(0 6px 10px rgba(0, 0, 0, .8)); }
    .class-stage .stage-glow { position: absolute; z-index: 2; pointer-events: none; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 190, 110, .55), rgba(255, 150, 60, .15) 60%, transparent); }
    .class-stage .stage-glow.step { animation: stageGlow .55s ease-out; }
    @keyframes stageGlow { from { opacity: 0; transform: scale(.5); } }
    .class-stage .stage-hit { position: absolute; z-index: 4; background: none; border: none; padding: 0; min-height: 0; cursor: pointer; box-shadow: none; }
    .class-stage .stage-arrow { position: absolute; z-index: 6; top: 50%; transform: translateY(-50%); width: 36px; height: 56px; padding: 0; font-size: 28px; line-height: 1;
        background: rgba(20, 14, 10, .55); border: 1px solid #6a4a2a; color: #f3d48a; }
    .class-stage .stage-arrow.l { left: 6px; } .class-stage .stage-arrow.r { right: 6px; }
    .class-stage .stage-title { position: absolute; z-index: 5; top: 3%; left: 0; right: 0; text-align: center; pointer-events: none; color: #e9d9b4; text-shadow: 0 2px 6px #000, 0 0 3px #000; }
    .class-stage .stage-title small { display: block; font-size: 12px; letter-spacing: 4px; opacity: .85; }
    .class-stage .stage-title b { display: block; font-size: 26px; letter-spacing: 6px; color: #f3d48a; margin: 2px 0; }
    .class-stage .stage-title span { display: block; font-size: 12px; padding: 0 10%; opacity: .9; }
    .class-art { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 30%; border-radius: 8px; margin-bottom: 8px; border: 1px solid #6a4a2a; }
    .stat-row { display: grid; grid-template-columns: 1fr auto 44px auto; align-items: center; gap: 8px; padding: 3px 0; }
    .stat-row b { text-align: center; font-size: 17px; }
    .points-left { text-align: right; margin-top: 6px; color: var(--gold); }

    /* 遊戲主畫面：外框（原圖座標 × --s） */
    body:has(#screen-game.active) { background: #050403; }
    #app:has(#screen-game.active) { max-width: none; }
    #screen-game { height: 100vh; height: 100dvh; align-items: center; justify-content: center; }
    #stage { display: flex; flex: none; position: relative; }
    #side {
        flex: none; height: 100%; overflow-y: auto; padding: 18px 22px 24px;
        background: linear-gradient(90deg, #0a0806, #1a1410 6%, #120e0b); border-left: 2px solid #5a4028;
        box-shadow: inset 8px 0 18px #000a;
    }
    #frame {
        --s: 0.28;
        position: relative; flex: none; width: 100%; height: 100%; overflow: hidden; background: #100c0a;
        border-style: solid; border-color: transparent; border-width: 0;
        /* frame-notop.jpg＝frame.jpg 去掉上方拱門（原圖 y 715 以上，2026-10-15 使用者要求滿版）；頂端 25px 還有拱門殘邊，slice 跳過 */
        /* frame-nopillar.png（2026-10-19，第 54 節）：frame-notop 縮 75%、左右骷髏頭頂的符文石柱改透明（底部淡入），地圖延伸到左右邊；slice 跟著 ×0.75 */
        /* frame-clean.png：再把骷髏、法球後面的暗色階梯底（欄杆以上）去背，只留骷髏與法球（2026-10-19，第 54 節） */
        border-image-source: url(images/frame-clean.png?v=20261028p);
        border-image-slice: 19 77 491 78 fill;
        border-image-width: 0 calc(var(--s) * 102px) calc(var(--s) * 655px) calc(var(--s) * 104px);
        border-image-repeat: stretch round;
    }
    /* 骷髏頭頂那一段（原圖 y 630～880）再疊一層在地圖上面，頭頂不會被地圖下緣切掉；去背的地方是透明的（第 54 節） */
    #frame::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: calc(var(--s) * 405px); height: calc(var(--s) * 250px);
        z-index: 2; pointer-events: none;
        background: url(images/frame-clean.png?v=20261028p) 0 calc(var(--s) * -630px) / 100% auto no-repeat;
    }
    #frame.pc::after { display: none; }
    /* 金幣、防禦、MR：經驗條正上方，左右分在等級兩側（手機原圖 y 1712～1744；PC y 870～904） */
    .hud-stats {
        position: absolute; left: calc(var(--s) * 390px); right: calc(var(--s) * 390px); bottom: calc(var(--s) * 258px); height: calc(var(--s) * 32px);
        z-index: 3; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none;
        font-size: max(9px, calc(var(--s) * 22px)); font-weight: bold; color: #e8e0cc; white-space: nowrap;
    }
    .hud-stats span { padding: 0 5px; border-radius: 4px; background: #0c0806d9; text-shadow: 0 0 2px #000; line-height: 1.35; }
    .hud-stats .gold { color: var(--gold); }
    .hud-stats .hud-mr { position: relative; }
    .hud-stats .hud-weight { position: absolute; left: calc(100% + 6px); top: 0; }
    /* 手機：MR與負重移到法球上方右側黑底，避開MP文字。 */
    #frame:not(.pc) .hud-stats .hud-mr { position: absolute; right: calc(var(--s) * -300px); bottom: calc(var(--s) * 310px); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    #frame:not(.pc) .hud-stats .hud-weight { position: static; padding: 0; background: none; }
    .hud-stats .dia { color: #8fd8ff; }
    #merc-vitals { position: absolute; left: calc(var(--s) * 90px); bottom: calc(var(--s) * 530px); z-index: 3; display: flex; flex-direction: column; gap: 2px; width: max-content; max-width: 46%; pointer-events: none; font-size: max(10px, calc(var(--s) * 22px)); font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.4; text-shadow: 0 1px 2px #000; }
    #merc-status { position:absolute;left:calc(var(--s) * 90px);top:calc(100% - var(--s) * 530px + 3px);z-index:3;width:calc(var(--s) * 380px);max-width:30%;pointer-events:none;color:#ead4a5;font-size:max(9px,calc(var(--s) * 16px));line-height:1.25;text-shadow:0 1px 2px #000,1px 0 2px #000; }
    #merc-status[hidden] { display:none; }
    .merc-hud-runes { display:flex;gap:3px;align-items:center; }
    .merc-hud-icon { width:max(14px,calc(var(--s) * 28px));height:max(14px,calc(var(--s) * 28px));object-fit:contain;border:1px solid #8c7748;background:#111a;border-radius:3px; }
    .merc-hud-text { margin-top:2px;overflow-wrap:anywhere; }
    #frame.pc #merc-status { left:calc(var(--s) * 320px);top:calc(100% - var(--s) * 270px + 2px);width:calc(var(--s) * 300px);max-width:26%; }
    #merc-vitals[hidden] { display: none; }
    #merc-vitals span { padding: 0 5px; border-radius: 3px; background: #0c0806d9; white-space: nowrap; }
    #merc-vitals .merc-hp { color: #ffaaa0; }
    #merc-vitals .merc-mp { color: #9fd7ff; }
    #frame.pc #merc-vitals { left: calc(var(--s) * 320px); bottom: calc(var(--s) * 270px); max-width: 32%; }
    .npc-say { font-style: italic; color: #e9d9b4; border-left: 3px solid #8a6a3a; }
    .npc-talk { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }   /* 野外 NPC 對話：頭像＋台詞（第 55 節） */
    .npc-talk .npc-face { width: 72px; height: 72px; flex: none; object-fit: cover; border-radius: 8px; border: 1px solid #8a6a3a; box-shadow: 0 0 8px #000a; }
    .npc-talk .npc-say { margin: 0; padding-left: 8px; }
    .hud-stats .hud-lv-gap { width: calc(var(--s) * 120px); padding: 0; background: none; }
    #panel {
        position: absolute; top: calc(var(--s) * 20px); left: 0; right: 0;   /* 左右石柱拿掉，滿版（第 54 節） */
        bottom: calc(var(--s) * 626px); overflow-y: auto; padding: 4px 6px 10px;
    }
    /* 狩獵畫面：地圖填滿整個 #panel（操作按鈕浮在地圖上，2026-10-15） */
    #panel:has(> .hunt-view) { padding: 0; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--gold); }
    #hud-bottom {
        position: absolute; left: calc(var(--s) * 214px); right: calc(var(--s) * 214px);
        bottom: calc(var(--s) * 420px); height: calc(var(--s) * 200px);
        display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 12px; text-shadow: 0 1px 3px #000;
    }
    .hud-where { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 經驗條（手機原圖 x 380～962、y 1746～1762；PC 原圖 x 300～1700、y 907～925）與等級（欄杆中間裝飾） */
    .exp-strip {
        position: absolute; left: calc(var(--s) * 380px); right: calc(var(--s) * 380px); bottom: calc(var(--s) * 238px);
        height: max(9px, calc(var(--s) * 18px)); z-index: 3; overflow: hidden; border-radius: 3px;
        background: #0c0806e6; border: 1px solid #a07a45; box-shadow: 0 0 4px #000;
    }
    .exp-fill { height: 100%; width: 0; background: linear-gradient(#f3d77a, #c9962f); transition: width .3s; }
    .exp-strip span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: max(8px, calc(var(--s) * 15px)); line-height: 1; color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000; white-space: nowrap; }
    .lv-badge {

        background: linear-gradient(90deg, #ff5f6d, #ffc371, #fff36b, #5cffb0, #5ecbff, #b68cff, #ff5f6d); background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: curFlow 2.5s linear infinite; }
    @keyframes curFlow { to { background-position: 200% center; } }
    .doll-T1 { color: #ff5555; } .doll-T2 { color: #ffd84a; }

    .doll-T0 { color: #ffd84a; font-weight: bold;
        background: linear-gradient(90deg, #ff5555, #ffab4a, #fff36b, #5cff90, #5ecbff, #7777ff, #db77ff, #ff5555); background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: curFlow 2.5s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .doll-T0 { animation: none; } }

    .cursed { color: var(--bad); }
    /* 祝福／詛咒的對武器・盔甲施法的卷軸（ui-panels.itemClass）：詛咒深紅、祝福金色神聖流光 */
    .scroll-curse { color: #a8122b; font-weight: bold; text-shadow: 0 0 6px #4a0008, 0 0 1px #2a0005; }
    .scroll-bless { font-weight: bold; color: #ffd84a; filter: drop-shadow(0 0 3px #ffd84a66);
        background: linear-gradient(100deg, #c9921e 0%, #ffd84a 35%, #fffbe6 50%, #ffd84a 65%, #c9921e 100%); background-size: 250% auto;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: blessFlow 2.8s linear infinite; }
    @keyframes blessFlow { from { background-position: 125% center; } to { background-position: -125% center; } }
    @media (prefers-reduced-motion: reduce) { .scroll-bless { animation: none; } }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .set-row:last-of-type { border-bottom: 0; }
    .loot-keep { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
    .loot-keep .mini { padding: 3px 8px; }

    /* 職業任務 */
    .story p, .story-text { line-height: 1.7; }
    .story-text { color: #d8cfb8; font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; border-radius: 0; }
    .quest-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .quest-card.current { border-color: var(--gold); }
    .quest-card.done { opacity: .75; }
    .quest-card.locked { opacity: .45; }
    .quest-card p { margin: 6px 0; line-height: 1.7; }
    .quest-head { display: flex; justify-content: space-between; align-items: center; }
    .quest-goal { color: var(--gold); margin: 6px 0 2px; }
    .quest-act { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .quest-act .bar { flex: 1; min-width: 160px; }

    /* 對話框、提示 */
    #dialog-layer { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    #dialog-layer.active { display: flex; }
    .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 100%; max-width: 440px; max-height: 86vh; display: flex; flex-direction: column; }
    .dialog h3 { margin: 0 0 10px; color: var(--gold); }
    .dialog-body { overflow-y: auto; line-height: 1.7; }
    .dialog-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #toast-layer { position: fixed; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; }
    .toast { background: #000e; border: 1px solid var(--line); padding: 8px 16px; border-radius: 20px; animation: toast-in .2s; max-width: 90%; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
    #pwa-update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; max-width: calc(100vw - 24px); width: max-content; white-space: normal; box-shadow: 0 0 18px #dca84a88; background: var(--gold); color: #2a1a05; font-weight: bold; border-radius: 20px; padding: 10px 18px; }

    @media (max-width: 420px) {

    /* 帳號登入／雲端存檔（cloud.js，ARCHITECTURE.md 第 29 節） */
    .cloud-field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }

    .cloud-msg.bad { color: #ff8a7a; }

    /* 團隊副本（raid.js，ARCHITECTURE.md 第 30 節） */
    .raid-pick { border-color: var(--gold); }
    .raid-code { font-size: 18px; margin: 4px 0 6px; }
    .raid-code b { font-size: 26px; letter-spacing: 4px; color: var(--gold); user-select: all; }
    .raid-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .raid-slot { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); font-size: 13px; }
    .raid-slot.ready { border-color: var(--good); }
    .raid-slot.empty { color: var(--muted); justify-content: center; text-align: center; border-style: dashed; }
    .raid-mems { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .raid-mem { font-size: 13px; }
    .raid-mem.me span { color: var(--gold); }
    .raid-mem.down { opacity: .45; }
    .raid-bar { position: relative; height: 16px; background: #000a; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 2px; }
    .raid-bar > div { height: 100%; background: var(--hp, #b8322a); transition: width .4s; }
    .raid-bar.boss { height: 22px; }
    .raid-bar.boss > div { background: linear-gradient(90deg, #7a1c12, #d0482c); }
    .raid-bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: normal; text-shadow: 0 1px 2px #000; }
    .raid-log { max-height: 260px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
    @media (max-width: 420px) { .raid-slots, .raid-mems { grid-template-columns: 1fr; } }

    /* 聊天（chat.js，ARCHITECTURE.md 第 32 節） */
    .chat-panel { display: flex; flex-direction: column; gap: 8px; }
    .chat-list { height: 34vh; min-height: 160px; overflow-y: auto; background: #0007; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; line-height: 1.5; }
    .chat-sleep { text-align: center; margin-top: 6px; padding: 4px; border-top: 1px dashed var(--line); cursor: pointer; }
    .chat-line { padding: 2px 0; word-break: break-word; }
    .chat-time { color: var(--muted); font-size: 11px; margin-right: 6px; }
    .chat-name { color: #9fc8c0; font-weight: normal; margin-right: 6px; }
    .chat-name small { color: var(--muted); }
    .chat-line.mine .chat-name { color: var(--gold); }
    .chat-news { background: #ffb2570f; border-left: 2px solid #99652a; padding-left: 6px; }   /* 全服掉寶公告（第 139 節） */
    .chat-news small { color: var(--muted); }
    /* 全服掉寶公告跑馬燈：地圖上方中間，由右往左捲（chat.js 的 newsBannerNext） */
    #news-banner { position: absolute; top: 30px; left: 12%; width: 60%; height: 30px; z-index: 2; overflow: hidden; pointer-events: none; display: none;
        background: linear-gradient(90deg, #0000, #000a 12%, #000a 88%, #0000); border-top: 1px solid #99652a88; border-bottom: 1px solid #99652a88; }
    #news-banner.on { display: block; }
    #news-banner .nb-msg { position: absolute; left: 0; top: 0; height: 30px; line-height: 30px; white-space: nowrap; color: #ffe8c0; font-size: 15px; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
    .chat-input-row { display: flex; gap: 6px; }
    .chat-input-row input { flex: 1; min-width: 0; }

    /* 血盟（clan.js，ARCHITECTURE.md 第 33 節） */
    .clan-title { font-size: 22px; color: var(--gold); }
    .clan-form { display: flex; flex-direction: column; gap: 8px; }
    .list-row.clan-me { border-color: var(--gold); }

    /* 排行榜（rank.js，ARCHITECTURE.md 第 34 節） */
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }

    .rank-no { width: 34px; text-align: center; font-size: 16px; color: var(--gold); font-variant-numeric: tabular-nums; flex: none; }
    .rank-val { flex: none; color: var(--gold); font-variant-numeric: tabular-nums; }
    .list-row.rank-me { border-color: var(--gold); background: #3a2a1e; }

<div id="app">
    <!-- 標題 -->
    <section id="screen-title" class="screen">
        <h1 class="sr-only">黑暗大陸</h1>   <!-- 封面圖上已有標題字（images/cover.jpg） -->
        <div class="title-btns">
            <button id="btn-continue" onclick="continueGame()">📜 繼續冒險</button>
            <button id="btn-select" class="secondary" onclick="openCharSelect()">👥 人物選單</button>
            <button id="btn-new" class="secondary" onclick="openCreate()">⚔️ 建立新角色</button>
            <button id="btn-cloud" class="secondary hidden" onclick="openCloudDialog()">☁️ 登入／註冊</button>
            <button class="secondary" onclick="openInstallGuide()">📲 安裝到主畫面</button>
        </div>
        <div id="test-notice" class="test-notice hidden"></div>
        <button id="version" type="button" class="version-link muted" onclick="openUpdateNotes()" title="查看更新內容" aria-label="查看版本更新內容"></button>
    </section>

    <!-- 人物選單：多角色欄位（ARCHITECTURE.md 第 25 節） -->

        <div id="char-grid" class="char-grid"></div>

            <button class="secondary" onclick="showTitle()">返回</button>

            <button id="btn-play" onclick="playSelected()" style="flex:1">▶ 進入遊戲</button>
        </div>
    </section>

    <!-- 創角 -->

        <div class="loc">建立角色</div>
        <div id="class-stage" class="class-stage"></div>
        <div id="create-desc" class="panel"></div>
        <div class="panel">
            <h4>能力值分配 <small class="muted">（總點數 75，單項最高 18）</small></h4>

        </div>
        <div class="panel">
            <input id="create-name" type="text" maxlength="12" placeholder="角色名稱" style="width:100%">
        </div>
        <div class="btn-row">
            <button class="secondary" onclick="createBack()">返回</button>
            <button onclick="confirmCreate()" style="flex:1">✅ 建立角色</button>
        </div>
    </section>

    <!-- 遊戲 -->
    <section id="screen-game" class="screen">
        <!-- 外框（images/frame.jpg 九宮格），位置見 ARCHITECTURE.md 第 15 節 -->
        <div id="stage">

            <main id="panel"></main>

            <div id="frame-art"></div>
            <div id="overlay" class="hidden"></div>
            <div id="hud-bottom"></div>
            <!-- 經驗條：欄杆下緣與底部格子之間的石條；等級：欄杆正中間的裝飾（ARCHITECTURE.md 第 15、19 節） -->
            <div id="exp-strip" class="exp-strip"><div class="exp-fill"></div><span></span></div>
            <div id="lv-badge" class="lv-badge"></div>
            <div id="hud-stats" class="hud-stats"></div>
            <div id="merc-status" aria-label="傭兵技能與召喚狀態" hidden></div>
            <div id="merc-vitals" aria-label="傭兵即時生命與魔力" hidden><span class="merc-hp"></span><span class="merc-mp"></span></div>
            <button id="pillar-left" class="pillar left" onclick="toggleDrawer('left')" aria-label="角色選單"></button>
            <button id="pillar-right" class="pillar right" onclick="toggleDrawer('right')" aria-label="系統選單"></button>
            <div id="drawer-left" class="drawer left"></div>
            <div id="drawer-right" class="drawer right"></div>
            <button id="orb-hp" class="orb hp" onclick="orbHpClick()" aria-label="HP，點一下喝治癒藥水"><div class="orb-empty"></div><span></span></button>
            <button id="orb-mp" class="orb mp" onclick="orbMpClick()" aria-label="MP，點一下喝藍色藥水"><div class="orb-empty"></div><span></span></button>
            <div id="slots"></div>
            <!-- PC 外框的快捷欄（底部左右各 8 格＋上排 6 格，hotbar.js；手機版快捷欄畫在地圖下方 #skill-bar） -->
            <div id="hotbar"></div>
            <!-- 底部中間骷髏頭＝開始／停止掛機：眼睛黑＝沒在掛機、紅光＝掛機中（ARCHITECTURE.md 第 15 節） -->
            <!-- 左下（紅球下方）骷髏頭＝戰鬥訊息抽屜開關；抽屜從下往上滑出 -->
            <button id="skull-log" class="skull-log" onclick="toggleLogDrawer()" title="戰鬥訊息" aria-label="戰鬥訊息"><span><img src="images/ui/message-bubbles-v1.png" alt="" draggable="false"></span></button>

            <button id="skull-hunt" class="skull-hunt" onclick="skullHuntClick()" aria-label="開始掛機"><i class="eye l"></i><i class="eye r"></i></button>
        </div>
        <!-- PC 16:9 版面的右側欄（其他分頁顯示在這裡） -->
        <aside id="side" class="hidden"></aside>
        </div>
    </section>
