<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>浪跡江湖</title>
<meta name="theme-color" content="#14110d">
<style>
    :root {
        --bg: #14110d; --panel: #211c15ee; --panel2: #2d261c; --line: #4a3e2c;
        --text: #f0e7d3; --muted: #a39780; --gold: #e8c066; --accent: #8f3b2a; --accent2: #b9523a;
        --hp: #c8423a; --mp: #3d78c8; --exp: #d8b44a; --good: #7fc46a; --warn: #e0a64a; --bad: #e0605a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
    body { color: var(--text); font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; }
    button {
        font: inherit; color: var(--text); background: var(--accent); border: 1px solid #0004; border-radius: 7px;
        padding: 7px 11px; cursor: pointer; touch-action: manipulation;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:active:not(:disabled) { transform: scale(.96); }
    button:disabled { opacity: .4; cursor: default; }
    button.secondary { background: var(--panel2); border-color: var(--line); }
    button.danger { background: #6b1f1f; }
    button.mini { padding: 3px 8px; font-size: 12px; }
    button.big { width: 100%; padding: 12px; font-size: 18px; margin-top: 10px; }
    input, select, textarea { font: inherit; background: #0008; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
    input[type=number] { width: 60px; }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent2); vertical-align: middle; padding: 0; }
    textarea { width: 100%; height: 80px; font-size: 12px; word-break: break-all; margin-top: 8px; }
    h2 { color: var(--gold); text-align: center; letter-spacing: 6px; margin: 16px 0 4px; font-family: "Noto Serif TC", serif; }
    h4 { margin: 12px 0 6px; color: var(--gold); }
    small, .small { font-size: 12px; }
    .muted { color: var(--muted); } .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .gold { color: var(--gold); } .xw { color: #c9a8ff; }
    .btns { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

    /* 建立角色 */
    #create { max-width: 600px; margin: 0 auto; padding: 0 12px 20px; height: 100%; overflow-y: auto; }
    .create p { text-align: center; }
    .create-main { display: flex; gap: 12px; align-items: center; background: #211c15; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .create-opts { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .create-opts input[type=text] { width: 100%; margin-top: 4px; }
    .opt-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
    .opt-row > span { color: var(--muted); }
    .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid var(--line); }
    .swatch.on { border-color: var(--gold); box-shadow: 0 0 0 2px #e8c06655; }
    .sect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .sect-card { background: #211c15; border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .sect-card.on { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c), 0 0 12px -4px var(--c); }
    .sect-card b { color: var(--c); }

    /* 遊戲畫面 */
    #game { height: 100%; display: flex; flex-direction: column; }
    #hud { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: linear-gradient(#2a2016, #1a140e); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    #hud-bars { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 160px; max-width: 320px; }
    .bar { position: relative; height: 13px; background: #000a; border: 1px solid #0008; border-radius: 6px; overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; }
    .bar span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 12px; text-shadow: 0 1px 2px #000; }
    .bar.hp i { background: linear-gradient(#e0605a, var(--hp)); } .bar.mp i { background: linear-gradient(#5a9ae0, var(--mp)); } .bar.exp i { background: var(--exp); }
    #hud-name, #hud-money { white-space: nowrap; }
    #world-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #world { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: crosshair; }
    #minimap-box { position: absolute; top: 6px; right: 6px; background: #000a; border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
    #minimap { display: block; width: 150px; height: 112px; cursor: pointer; border-radius: 3px; }
    #hud-map { text-align: center; font-size: 12px; color: var(--gold); }
    #target { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 220px; background: #000b; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; text-align: center; font-size: 13px; }
    #buffs { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 3px; }
    .buff { font-size: 11px; background: #3d78c8aa; border-radius: 4px; padding: 1px 5px; }
    .buff.bad { background: #8a2a2aaa; }
    #log { position: absolute; left: 6px; bottom: 6px; width: min(360px, 60%); max-height: 96px; overflow-y: auto; background: #0008; border-radius: 6px; padding: 4px 6px; font-size: 12px; pointer-events: auto; }
    .log-line { padding: 1px 0; } .log-line.gold { color: var(--gold); } .log-line.bad { color: var(--bad); } .log-line.warn { color: var(--warn); } .log-line.good { color: var(--good); }

    #bottom { display: flex; gap: 8px; align-items: stretch; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(#1a140e, #2a2016); border-top: 1px solid var(--line); flex-wrap: wrap; justify-content: center; }
    #hotbar { display: grid; grid-template-columns: repeat(8, 54px); gap: 4px; }
    .hk { position: relative; height: 54px; padding: 0; background: #0009; border: 1px solid #8a7044; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .hk.empty { border-style: dashed; border-color: var(--line); }
    .hk.off .hk-icon { opacity: .35; }
    .hk .cd { position: absolute; left: 0; right: 0; bottom: 0; background: #000b; }
    .hk-key { position: absolute; top: 1px; left: 3px; font-size: 10px; color: var(--gold); }
    .hk-icon { font-size: 20px; line-height: 1; }
    .hk-name { font-size: 10px; white-space: nowrap; overflow: hidden; max-width: 52px; }
    .hk-n { position: absolute; right: 3px; bottom: 1px; font-size: 10px; }
    #menu { display: grid; grid-template-columns: repeat(3, auto); gap: 4px; }
    #menu button { padding: 4px 10px; font-size: 13px; }
    #btn-hunt.on { background: #2f6a2a; box-shadow: 0 0 8px #7fc46a; }

    #panel { position: absolute; top: 50px; right: 8px; width: min(420px, calc(100% - 16px)); max-height: calc(100% - 64px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; box-shadow: 0 8px 24px #000a; z-index: 5; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--gold); }
    .panel-body { overflow-y: auto; padding: 4px 10px 10px; }
    .list-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .list-row:last-child { border-bottom: 0; }
    .list-row.here { background: #e8c06612; }
    .list-row > div:first-child { min-width: 0; }
    .char-wrap { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
    .equip-list { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .equip-slot { display: grid; grid-template-columns: 2.6em 1fr; gap: 2px 6px; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
    .equip-slot .btns { grid-column: 2; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 2px 0; font-size: 13px; }
    .attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .attr { display: grid; grid-template-columns: 1fr auto; gap: 0 6px; background: var(--panel2); border-radius: 8px; padding: 5px 8px; }
    .attr small { grid-column: 1; } .attr button { grid-row: 1 / 3; grid-column: 2; align-self: center; }

    .avatar { overflow: visible; }
    .avatar.idle .av-body { animation: breathe 2.4s ease-in-out infinite; transform-origin: 60px 150px; }
    @keyframes breathe { 50% { transform: translateY(-2px); } }

    .toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: #000c; border: 1px solid var(--gold); padding: 7px 16px; border-radius: 8px; z-index: 20; pointer-events: none; }
    #modal { position: fixed; inset: 0; background: #0009; display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
    #modal.show { display: flex; }
    #modal .box { background: #211c15; border: 1px solid var(--gold); border-radius: 12px; padding: 16px; max-width: 360px; width: 100%; }
    #modal .btns { justify-content: flex-end; margin-top: 14px; }

    @media (max-width: 640px) {
        #hud { gap: 4px 8px; padding: 4px 6px; font-size: 12px; }
        #hud-bars { order: 3; flex-basis: 100%; max-width: none; }
        #hotbar { grid-template-columns: repeat(8, 1fr); width: 100%; }
        .hk { height: 46px; }
        .hk-name { display: none; }
        #menu { grid-template-columns: repeat(6, 1fr); width: 100%; }
        #minimap { width: 110px; height: 82px; }
        #target { top: 96px; width: 190px; }
        #log { max-height: 70px; }
        #panel { top: 6px; max-height: calc(100% - 12px); }
        .create-main { flex-direction: column; }
        .char-wrap { flex-direction: column; align-items: center; }
        .equip-list { width: 100%; }
    }
</style>
</head>
<body>
<div id="create" style="display:none"></div>
<div id="game" style="display:none">
  <div id="hud">
    <div id="hud-name"></div>
    <div id="hud-bars">
      <div class="bar hp"><i id="b-hp"></i><span id="t-hp"></span></div>
      <div class="bar mp"><i id="b-mp"></i><span id="t-mp"></span></div>
      <div class="bar exp"><i id="b-exp"></i><span id="t-exp"></span></div>
    </div>
    <div id="hud-money"></div>
  </div>
  <div id="world-wrap">
    <canvas id="world"></canvas>
    <div id="buffs"></div>
    <div id="target" style="display:none"><div id="tg-name"></div><div class="bar hp"><i id="b-tg"></i><span id="t-tg"></span></div></div>
    <div id="minimap-box"><canvas id="minimap" width="300" height="225"></canvas><div id="hud-map"></div></div>
    <div id="log"></div>
    <div id="panel" style="display:none"></div>
  </div>
  <div id="bottom">
    <div id="hotbar"></div>
    <div id="menu">
      <button id="btn-hunt" class="secondary" onclick="toggleHunt()">掛機</button>
      <button class="secondary" onclick="openPanel('char')">角色</button>
      <button class="secondary" onclick="openPanel('skill')">武學</button>
      <button class="secondary" onclick="openPanel('bag')">行囊</button>
      <button class="secondary" onclick="openPanel('map')">地圖</button>
      <button class="secondary" onclick="openPanel('set')">設定</button>
    </div>
  </div>
</div>
<div id="modal"><div class="box"><div id="modal-msg"></div><div class="btns"><button class="secondary" onclick="confirmCancel()">取消</button><button onclick="confirmOk()">確定</button></div></div></div>
<script src="data/config.js?v=20261102j"></script>
<script src="data/skills.js?v=20261102j"></script>
<script src="data/maps.js?v=20261102j"></script>
<script src="data/items.js?v=20261102j"></script>
<script src="data/avatar.js?v=20261102j"></script>
<script src="data/state.js?v=20261102j"></script>
<script src="data/world.js?v=20261102j"></script>
<script src="data/combat.js?v=20261102j"></script>
<script src="data/render.js?v=20261102j"></script>
<script src="data/ui.js?v=20261102j"></script>
<script src="data/main.js?v=20261102j"></script>
</body>
</html>
