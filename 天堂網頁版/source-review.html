<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版資料核對</title><style>body{margin:24px;background:#101820;color:#e9e4cf;font:16px system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#e5c47f}select,input,button{padding:12px;background:#1d303e;color:inherit;border:1px solid #697b83;border-radius:4px}input{min-width:300px}#status{white-space:pre-wrap;padding:18px;background:#192734;line-height:1.7}table{border-collapse:collapse;font-size:13px;white-space:nowrap}td,th{border:1px solid #47545e;padding:8px;text-align:left}th{position:sticky;top:0;background:#263b4c}.table{overflow:auto;max-height:70vh}#notice{color:#f4cf86}h1{font-size:25px}</style><header><h1>PC 原版資料核對</h1><a href="index.html">返回遊戲</a><a href="data/native-restoration-audit.json">實裝／缺項清單</a><a href="data/native-core-reference.json">核心與設定對照</a></header><p id="notice">資料存在不代表對應系統已完成。下方清單區分已執行與尚待移植，設定表可直接搜尋核對。</p><div id="status">讀取核對結果…</div><p><select id="tables"></select> <input id="search" placeholder="搜尋名稱、編號、Map ID 或數值"> <span id="count"></span></p><div class="table"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><script src="data/database/manifest.js"></script><script>
let current,loaded=new Map();window.GameDatabase={register(name,columns,rows){loaded.set(name,{columns,rows})}};const select=document.querySelector('#tables'),search=document.querySelector('#search');for(const entry of gameDatabaseManifest.filter(t=>t.file)){const o=document.createElement('option');o.value=entry.name;o.textContent=entry.name;select.append(o)}select.value='npc';async function change(){const entry=gameDatabaseManifest.find(t=>t.name===select.value);if(!loaded.has(entry.name))await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='data/database/'+entry.file;s.onload=ok;s.onerror=fail;document.head.append(s)});current=loaded.get(entry.name);paint()}function paint(){const q=search.value.trim().toLowerCase(),rows=current.rows.filter(r=>!q||r.some(v=>String(v??'').toLowerCase().includes(q))),head=document.querySelector('#head'),body=document.querySelector('#body');head.replaceChildren();body.replaceChildren();const tr=document.createElement('tr');for(const c of current.columns){const th=document.createElement('th');th.textContent=c.name;tr.append(th)}head.append(tr);for(const row of rows.slice(0,250)){const tr=document.createElement('tr');for(const v of row){const td=document.createElement('td');td.textContent=v??'';tr.append(td)}body.append(tr)}document.querySelector('#count').textContent='符合 '+rows.length+' 筆（顯示前 250 筆）'}select.onchange=change;search.oninput=paint;fetch('data/native-restoration-audit.json').then(r=>r.json()).then(a=>{document.querySelector('#status').textContent='原始 NPC／怪物 '+a.npcTemplates+' 筆｜怪物技能 '+a.monsterSkills+' 筆｜掉落 '+a.dropRows+' 筆｜地圖設定 '+a.mapDefinitions+' 筆\n已接場景：Map 0、4；663 原始區塊，原生像素 1:1；完整生成數量，不再縮減。\n未成功解出的外觀：'+a.missingGfx.join('、')+'\n尚待完成：\n'+a.pendingSystems.map(s=>'• '+s).join('\n')});change();
</script></html>
