<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 任務：捲軸＋封蠟，配色照目錄其他銅色圖示 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a466"/><stop offset=".5" stop-color="#f0d9a2"/><stop offset="1" stop-color="#b98a4a"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d79a"/><stop offset=".5" stop-color="#b98443"/><stop offset="1" stop-color="#6b4319"/>
    </linearGradient>
    <radialGradient id="wax" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#e2574a"/><stop offset="1" stop-color="#7a1712"/>
    </radialGradient>
  </defs>
  <g stroke="#2a1708" stroke-width="2" stroke-linejoin="round">
    <rect x="15" y="12" width="34" height="40" rx="2" fill="url(#paper)"/>
    <rect x="10" y="8" width="44" height="8" rx="4" fill="url(#roll)"/>
    <rect x="10" y="48" width="44" height="8" rx="4" fill="url(#roll)"/>
  </g>
  <g stroke="#6b4a22" stroke-width="2" stroke-linecap="round">
    <line x1="21" y1="23" x2="43" y2="23"/><line x1="21" y1="29" x2="43" y2="29"/><line x1="21" y1="35" x2="35" y2="35"/>
  </g>
  <circle cx="40" cy="41" r="6" fill="url(#wax)" stroke="#3a0b08" stroke-width="1.5"/>
</svg>
