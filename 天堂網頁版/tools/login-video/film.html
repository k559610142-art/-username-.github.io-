<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>這奇怪的天堂 · 開場影片</title>
<style>html,body{margin:0;background:#02070b;height:100%;display:grid;place-items:center}canvas{width:100vw;max-height:100vh;object-fit:contain}</style>
<canvas id="film" width="1920" height="1080"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),W=1920,H=1080,art=new Image();
art.src='../../assets/entry/strange-paradise-video/welcome-cast-v1.png';
const CLASSES=['王族','騎士','法師','妖精','黑暗妖精','龍騎士','幻術師','戰士'];
const LINES=['王者的誓約，與你同行','以劍與盾，守護每一次冒險','讓奧術，照亮未知的道路','循著森林的低語，奔向遠方','在暗影之中，尋找自己的光','龍之血脈，將再次甦醒','真實與幻象，由你揭曉','以不屈的意志，迎向戰場'];
const POS=[.085,.21,.34,.445,.55,.665,.78,.90];
const SHOTS=[{start:0,end:4,kind:'opening'},...CLASSES.map((name,i)=>({start:4+i*4,end:8+i*4,kind:'hero',name,i})),...[0,1,2].map(i=>({start:36+i*3,end:39+i*3,kind:'unknown',i})),{start:45,end:56,kind:'welcome'},{start:56,end:66,kind:'login'}];
const ease=x=>x*x*(3-2*x),clamp=x=>Math.min(1,Math.max(0,x));
function text(value,x,y,size,color='#f8dfaa',align='center',weight=500){ctx.textAlign=align;ctx.font=weight+' '+size+'px "Microsoft JhengHei",sans-serif';ctx.shadowColor='#000';ctx.shadowBlur=14;ctx.fillStyle=color;ctx.fillText(value,x,y);ctx.shadowBlur=0;}
function background(scale=1,cx=.5,cy=.5){const base=Math.max(W/art.width,H/art.height),s=base*scale;let x=W/2-cx*art.width*s,y=H/2-cy*art.height*s;x=Math.min(0,Math.max(W-art.width*s,x));y=Math.min(0,Math.max(H-art.height*s,y));ctx.drawImage(art,x,y,art.width*s,art.height*s);}
function shade(top=.45,bottom=.7){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(2,8,15,'+top+')');g.addColorStop(.35,'rgba(2,8,15,0)');g.addColorStop(.65,'rgba(2,8,15,0)');g.addColorStop(1,'rgba(2,8,15,'+bottom+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function particles(t){ctx.save();for(let i=0;i<65;i++){const x=(i*337.7+Math.sin(t*.14+i)*27)%W,y=H-((i*91.3+t*(8+i%9))%H);ctx.globalAlpha=.14+.22*(.5+.5*Math.sin(t+i));ctx.fillStyle=i%4?'#efd6a0':'#93e7ef';ctx.beginPath();ctx.arc(x,y,1+i%3*.5,0,Math.PI*2);ctx.fill();}ctx.restore();}
function title(sub='八種傳承・三道未知的命運'){text('這奇怪的天堂',W/2,92,66,'#f4dfaa','center',700);text(sub,W/2,135,22,'#c0d5da');ctx.strokeStyle='#bba16a99';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(600,158);ctx.lineTo(1320,158);ctx.stroke();}
function box(x,y,w,h){ctx.fillStyle='#07121de8';ctx.strokeStyle='#bda16d';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.fill();ctx.stroke();}
function login(){ctx.fillStyle='#030a11c9';ctx.fillRect(0,852,W,228);ctx.strokeStyle='#bda16d88';ctx.beginPath();ctx.moveTo(300,852);ctx.lineTo(1620,852);ctx.stroke();text('歡迎回來，冒險者',W/2,887,23,'#e6d5ac');const x=425,y=924;for(const [i,label]of ['帳號','密碼'].entries()){text(label,x+i*410,y-10,20,'#d8c39b','left');box(x+i*410,y,380,58);text(i?'請輸入密碼':'請輸入帳號',x+18+i*410,y+37,22,'#809398','left');}ctx.fillStyle='#ac8040';ctx.beginPath();ctx.roundRect(1245,y,240,58,5);ctx.fill();text('登入',1365,y+38,25,'#fff1ce','center',700);text('註冊帳號',790,1030,22,'#e2d0a8');text('│',960,1030,20,'#718389');text('忘記密碼',1130,1030,22,'#e2d0a8');}
function shot(s,t){const p=clamp((t-s.start)/(s.end-s.start));if(s.kind==='hero'){background(2.0+.09*ease(p),POS[s.i],.49);shade(.26,.83);text('八大職業  '+String(s.i+1).padStart(2,'0')+' / 08',155,826,24,'#bcd9dc','left');text(s.name,150,910,76,'#f4dfaa','left',700);text(LINES[s.i],155,965,29,'#e0e9e7','left');}else if(s.kind==='unknown'){background(2.15+.06*p,[.34,.50,.655][s.i],.235);shade(.4,.9);text('未知職業  '+['Ⅰ','Ⅱ','Ⅲ'][s.i],W/2,912,60,'#dfd0ff','center',700);text('尚未揭曉的力量，正在等待你',W/2,969,27,'#d7e3e9');}else{background(s.kind==='opening'?1.045-.035*ease(p):1);shade(s.kind==='login'?.18:.27,s.kind==='login'?.1:.62);title(s.kind==='welcome'?'所有命運，在此相會':s.kind==='login'?'你的冒險，即將開始':undefined);if(s.kind==='opening'){text('一個熟悉，卻又不同的世界',W/2,946,32,'#e2e9e7');}else if(s.kind==='welcome'){text('歡迎來到',W/2,908,34,'#e6e9e5');text('這奇怪的天堂',W/2,978,62,'#f7dda0','center',700);}else login();}particles(t);}
function renderFilm(t){const index=Math.max(0,SHOTS.findIndex(s=>t<s.end)),s=SHOTS[index]||SHOTS.at(-1);ctx.fillStyle='#03070b';ctx.fillRect(0,0,W,H);if(index>0&&t-s.start<.7){shot(SHOTS[index-1],t);ctx.save();ctx.globalAlpha=ease(clamp((t-s.start)/.7));shot(s,t);ctx.restore();}else shot(s,t);const fade=t<1.2?1-t/1.2:0;if(fade){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,W,H);}return s.kind;}
window.ready=art.decode().then(()=>{renderFilm(65);return true});
window.renderFilm=renderFilm;
window.recordFilm=async()=>{await ready;const stream=canvas.captureStream(24),chunks=[],mime='video/mp4;codecs=avc1.42001E';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000});const done=new Promise(resolve=>recorder.onstop=resolve);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start(1000);const start=performance.now();await new Promise(resolve=>{function frame(){const t=(performance.now()-start)/1000;renderFilm(Math.min(65.99,t));if(t<66)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});recorder.stop();await done;stream.getTracks().forEach(t=>t.stop());const bytes=new Uint8Array(await new Blob(chunks,{type:'video/mp4'}).arrayBuffer());let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s);};
</script>
