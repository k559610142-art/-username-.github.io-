<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>七元神 · 男女法相圖鑑</title><style>*{box-sizing:border-box}body{margin:0;background:#090f16;color:#e7dec9;font-family:system-ui}main{max-width:1400px;margin:auto;padding:32px 20px}h1{font-family:serif;letter-spacing:5px}p{color:#9fa99d;font-size:13px;line-height:1.8}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article{background:radial-gradient(ellipse at 50% 30%,#253038,#111a22 70%);border:1px solid #5c5139;border-radius:12px;overflow:hidden}img{display:block;width:100%;height:310px;object-fit:contain;padding:12px}article>div{padding:18px;border-top:1px solid #37413b}h2{margin:5px 0;font-family:serif;letter-spacing:3px}small{color:#b9a479}a{display:inline-block;color:#e8c278;font-size:13px;margin-top:10px}article p{min-height:46px;margin:10px 0}.filters{display:flex;gap:10px;margin:20px 0}button{min-height:44px;padding:10px 18px;color:#e8c278;border:1px solid #655333;border-radius:6px;background:#16212b;cursor:pointer}article[hidden]{display:none}footer{margin-top:22px;font-size:12px;color:#859184}</style><main><small>凡塵修仙傳 / 法相造型提案</small><h1>七元神 · 男女法相圖鑑</h1><p>金、木、水、火、土、雷、風，每屬性各有男／女版本，共14款，對應遊戲內12種元神。點選「進入演武場」可試播召喚。<br>目前只更新獨立原型，正式遊戲、數值與版面均未更動。</p><div class="filters" role="group" aria-label="法相性別篩選"><button data-filter="all">全部14款</button><button data-filter="male">男性7款</button><button data-filter="female">女性7款</button></div><div id="grid"></div><footer>法相美術與人物分離 · 保留既有七款，補齊七款對應性別造型 · 整圖動畫原型</footer></main><script src="faxiang-config.js"></script><script>
for(const [id,t] of Object.entries(FAXIANG_CONFIG))for(const [gender,v] of Object.entries(FAXIANG_VARIANTS[id])){
 const a=document.createElement('article');a.dataset.gender=gender;const souls=Object.values(FAXIANG_YUANSHEN).filter(s=>s.faxiang===id).map(s=>s.name).join('／');
 a.innerHTML=`<img src="${resolveFaxiangAsset(v.img)}" alt="${v.name}"><div><small style="color:${t.color}">${t.element} · ${gender==='male'?'男性':'女性'}</small><h2>${v.name}</h2><p>${t.desc}<br>法器：${t.weapon}</p><small>${souls}</small><br><a href="index.html?faxiang=${id}&playerGender=${gender}">以${gender==='male'?'男':'女'}玩家預覽 →</a></div>`;document.getElementById('grid').append(a);
}
for(const button of document.querySelectorAll('[data-filter]'))button.addEventListener('click',()=>{for(const a of document.querySelectorAll('article'))a.hidden=button.dataset.filter!=='all'&&a.dataset.gender!==button.dataset.filter;});
</script></html>
