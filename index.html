<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>凡人修仙傳 - 進入世界</title>
    <style>
        /* 基本佈局，確保全螢幕且無捲軸 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 防止主頁出現捲軸 */
            background-color: #05070a; /* 如果圖片載入慢，先顯示深色背景 */
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* 主頁容器，載入背景圖 */
        #home-page {
            position: relative; /* 為了讓按鈕定位 */
            width: 100%;
            height: 100%;
            /* ### 你的背景圖片連結 ### */
            background-image: url('https://files.catbox.moe/lt9r3d.jfif');
            background-size: cover; /* 讓圖片完整覆蓋螢幕，可能會切掉邊緣 */
            background-position: center; /* 圖片居中 */
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* 主頁在最上層 */
            transition: transform 0.8s ease-in-out; /* 開門動畫 */
        }

        /* 按鈕定位容器（用來精確定位透明點擊區域） */
        .button-positioner {
            position: absolute;
            /* 根據圖片中「進入世界」按鈕的位置進行調整 */
            bottom: 22%; /* 距離底部 */
            width: 32%;  /* 按鈕寬度（相對於螢幕） */
            height: 10%; /* 按鈕高度（相對於螢幕） */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 實際的透明點擊連結 */
        #enter-world-btn {
            display: block;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0); /* 完全透明 */
            cursor: pointer;
            text-decoration: none; /* 去除底線 */
            outline: none; /* 去除點擊時的藍色邊框 */
            -webkit-tap-highlight-color: transparent; /* 去除移動端點擊高亮 */
            border-radius: 10px; /* 約略匹配按鈕圓角 */
        }

        /* 遊戲區域（原本是隱藏的） */
        #game-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5; /* 在主頁下方 */
            background-color: #0b0f19; /* 遊戲背景色，與你代碼中的 bg-color 匹配 */
            display: none; /* 預設隱藏 */
        }

        /* 當主頁「打開」時的樣式 */
        #home-page.opened {
            transform: translateY(-100%); /* 向上移動，像「抽屜打開」的感覺 */
        }

        /* 作者標記容器 */
        .author-tag {
            position: absolute;
            bottom: 2px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6); /* 半透明白色 */
            font-size: 14px;
            pointer-events: none; /* 讓它不影響點擊 */
        }

    </style>
</head>
<body>

    <!-- 主頁 (圖片) -->
    <div id="home-page">
        <!-- 這是透明的按鈕層，精確定位在「進入世界」圖片上 -->
        <div class="button-positioner">
            <!-- ### 修改你的遊戲檔名路徑 ### -->
            <!-- 如果你的遊戲 HTML 檔名是 'MyCoolGame.html'，請修改下方 href 的 game.html -->
            <a href=" 凡人修仙傳 " id="enter-world-btn" title="進入凡人修仙世界" onclick="openGame(event)"></a>
        </div>
    </div>

    <!-- 遊戲區域 -->
    <div id="game-view">
        <!-- 我們用一個 iframe 來嵌入你寫好的網頁遊戲 -->
        <!-- 注意：此時 src 是空的，在點擊「進入世界」後才會載入 -->
        <iframe src="" id="game-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <script>
        // 當點擊透明按鈕時執行的 JS
        function openGame(event) {
            // 防止連結直接 跳轉 頁面
            event.preventDefault();

            // 1. 取得遊戲連結 (href)
            var gameUrl = document.getElementById('enter-world-btn').getAttribute('href');

            // 2. 獲取遊戲 iframe
            var gameIframe = document.getElementById('game-iframe');

            // 3. 將遊戲網址載入到 iframe
            gameIframe.src = gameUrl;

            // 4. 顯示遊戲視圖
            document.getElementById('game-view').style.display = 'block';

            // 5. 為主頁加上 'opened' 類別，觸發開門动画
            document.getElementById('home-page').classList.add('opened');

            // 6. 動畫完成後 (0.8s)，可選：將主頁完全移除出視圖
            setTimeout(function() {
                // document.getElementById('home-page').style.display = 'none'; // 可根據需要決定是否執行
            }, 800);
        }
    </script>
</body>
</html>
