<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武林群俠傳｜本機素材與技能資料</title><style>*{box-sizing:border-box}body{margin:0;background:#101a19;color:#e9eddf;font:14px 'Microsoft JhengHei',sans-serif}header{padding:32px 5vw;border-bottom:1px solid #b5b48333;background:#182825}small{color:#a5bdad;letter-spacing:2px}h1{font-size:27px;font-weight:500;letter-spacing:3px;margin:12px 0}#summary{color:#bacabb;line-height:1.8}main{padding:24px 5vw}nav,.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,select,input{background:#203b32;border:1px solid #6a8c7166;border-radius:4px;color:#edf0dc;padding:10px;font:inherit}button{cursor:pointer}button.active{background:#b4b27d;color:#15231b}input{min-width:260px;flex:1}.filters input{background:#132721}a{color:#c8dfbc}#info{color:#aabea9;margin:16px 0;font-size:12px}#images{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:#1c2c26;border:1px solid #d3dfac22;border-radius:5px;overflow:hidden}.thumb{height:132px;display:flex;align-items:center;justify-content:center;background-color:#26352e;background-image:linear-gradient(45deg,#ffffff06 25%,transparent 25%),linear-gradient(-45deg,#ffffff06 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff06 75%),linear-gradient(-45deg,transparent 75%,#ffffff06 75%);background-size:16px 16px}.thumb img{max-width:100%;max-height:124px;object-fit:contain;image-rendering:auto}.caption{padding:10px;font-size:11px;overflow-wrap:anywhere;line-height:1.7}.caption span{display:block;color:#91ab97}.card a{text-decoration:none}.pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:24px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #749b7c33;padding:12px;vertical-align:top}th{color:#b6c69d;background:#1c3228}.description{white-space:pre-wrap;min-width:230px;line-height:1.8}td.code{font-family:monospace;font-size:10px;overflow-wrap:anywhere;max-width:150px}#skills{overflow:auto}.notice{padding:15px 18px;border-left:3px solid #b8b584;background:#1d2e26;margin:18px 0;font-size:12px;line-height:1.8;color:#c5cfb9}footer{padding:20px 5vw;border-top:1px solid #bdc69b22;font-size:11px;color:#8ea493}#images[hidden],#skills[hidden]{display:none}@media(max-width:650px){header{padding:24px}main{padding:16px}h1{font-size:22px}.filters input{min-width:180px}}</style><body><header><small>LOCAL RESEARCH MATERIAL LIBRARY</small><h1>武林群俠傳 · 素材與技能資料</h1><div id="summary">正在讀取本機索引…</div></header><main><nav><button id="imageTab" class="active">圖片素材</button><button id="skillTab">技能設定</button><a href="整理報告.md">整理報告</a><a href="skills/技能名稱與說明.csv">技能 CSV</a></nav><div class="filters"><input id="query" aria-label="搜尋" placeholder="搜尋圖片名稱、套件或技能名稱…"><select id="category" aria-label="分類"></select><select id="package" aria-label="套件"></select></div><div class="notice">圖片保留來源對照，可點縮圖開啟原尺寸。技能說明中的 ^0 等參數占位符仍保留；未知數值欄位沒有推測成傷害、消耗或冷卻，原始記錄與十六進位資料可在 skills 查看。</div><div id="info"></div><section id="images"></section><section id="skills" hidden></section><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><footer>僅供本機研究 · 原始來源未修改 · 未提交、推送或發布 · 檔案存在不代表已取得對外發布授權</footer><script src="catalog-data.js"></script><script>
const d=window.WL_MATERIALS,$=id=>document.getElementById(id);let mode='images',page=0;const pageSize=72;const uri=p=>p.split('/').map(encodeURIComponent).join('/');$('summary').textContent='可預覽 PNG '+d.summary.pngImages.toLocaleString()+' 張 · 武功 '+d.skills.filter(s=>s.kind==='武功').length+' 筆 · 寵物／機關技能 '+d.skills.filter(s=>['寵物技能','機關技能'].includes(s.kind)).length+' 筆 · 另有狀態與套裝資料';function options(){const kinds=mode==='images'?[...new Set(d.images.filter(i=>i.file.endsWith('.png')).map(i=>i.kind))]:[...new Set(d.skills.map(s=>s.kind))];$('category').replaceChildren(new Option('全部分類',''),...kinds.sort().map(x=>new Option(x,x)));$('package').hidden=mode!=='images';if(mode==='images')$('package').replaceChildren(new Option('全部套件',''),...[...new Set(d.images.map(i=>i.package).filter(Boolean))].sort().map(x=>new Option(x,x)));}function render(){const q=$('query').value.trim().toLowerCase(),cat=$('category').value,pkg=$('package').value;const rows=(mode==='images'?d.images.filter(i=>i.file.endsWith('.png')):d.skills).filter(x=>(!cat||x.kind===cat)&&(mode!=='images'||!pkg||x.package===pkg)&&(!q||[x.name,x.description,x.file,x.source,x.package,String(x.id??'')].join(' ').toLowerCase().includes(q)));page=Math.max(0,Math.min(page,Math.ceil(rows.length/pageSize)-1));$('images').hidden=mode!=='images';$('skills').hidden=mode==='images';$('info').textContent='符合 '+rows.length.toLocaleString()+' 筆；目前顯示 '+(rows.length?page*pageSize+1:0)+'–'+Math.min(rows.length,(page+1)*pageSize);$('prev').disabled=page===0;$('next').disabled=(page+1)*pageSize>=rows.length;$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(rows.length/pageSize));const slice=rows.slice(page*pageSize,(page+1)*pageSize);if(mode==='images'){$('images').replaceChildren(...slice.map(x=>{const card=document.createElement('article');card.className='card';const a=document.createElement('a');a.href=uri(x.file);a.target='_blank';a.rel='noopener';const thumb=document.createElement('div');thumb.className='thumb';const img=document.createElement('img');img.src=uri(x.file);img.loading='lazy';img.alt=x.name||x.file.split('/').at(-1);thumb.append(img);const caption=document.createElement('div');caption.className='caption';caption.textContent=x.name||x.file.split('/').at(-1);for(const text of [x.width+' × '+x.height,x.package||x.source]){const span=document.createElement('span');span.textContent=text;caption.append(span);}a.append(thumb,caption);card.append(a);return card;}));}else{const table=document.createElement('table'),head=document.createElement('tr');for(const text of ['ID','分類','名稱','原始說明（格式符號簡化）','來源']){const th=document.createElement('th');th.textContent=text;head.append(th);}table.append(head);for(const x of slice){const tr=document.createElement('tr');[x.id,x.kind,x.name,(x.description||'原檔未提供可讀說明').replaceAll('|','\n').replace(/%[a-z]/gi,''),x.source+' @ '+x.offset].forEach((value,i)=>{const td=document.createElement('td');td.textContent=String(value);if(i===3)td.className='description';if(i===4)td.className='code';tr.append(td);});table.append(tr);}$('skills').replaceChildren(table);}}for(const id of ['query','category','package'])$(id).addEventListener(id==='query'?'input':'change',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();scrollTo(0,0);};$('next').onclick=()=>{page++;render();scrollTo(0,0);};for(const [id,value]of [['imageTab','images'],['skillTab','skills']])$(id).onclick=()=>{mode=value;page=0;$('imageTab').classList.toggle('active',mode==='images');$('skillTab').classList.toggle('active',mode==='skills');options();render();};options();$('category').value='介面或圖示';render();
</script></body></html>
