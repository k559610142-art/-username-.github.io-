<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>幻想群俠傳</title><link rel="stylesheet" href="data/game-screen.css">
<script defer src="data/config.js"></script>
<script defer src="data/world.js"></script>
<script defer src="data/village-map.js"></script>
<script defer src="data/adventure-map.js"></script>
<script defer src="data/camera.js"></script>
<script defer src="data/characters.js"></script>
<script defer src="data/walk-frames/s.js"></script>
<script defer src="data/walk-frames/sw.js"></script>
<script defer src="data/walk-frames/w.js"></script>
<script defer src="data/walk-frames/nw.js"></script>
<script defer src="data/walk-frames/n.js"></script>
<script defer src="data/walk-frames/ne.js"></script>
<script defer src="data/walk-frames/e.js"></script>
<script defer src="data/walk-frames/se.js"></script>
<script defer src="data/character-renderer.js"></script>
<script defer src="data/movement.js"></script>
<script defer src="data/interactions.js"></script>
<script defer src="data/village.js"></script>
<script defer src="data/player.js"></script>
<script defer src="data/save.js"></script>
<script defer src="data/ui.js"></script>
<script defer src="data/main.js"></script>
</head><body>
<main id="game"><canvas id="village-canvas" tabindex="0" aria-label="遊戲場景，點擊地面移動，點擊村民交談"></canvas>
<div class="player-hud" aria-label="角色狀態"><div class="identity"><strong>初行俠客</strong><span id="player-level">Lv.1</span></div><div class="meter hp" role="meter" aria-label="氣血" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span class="meter-fill" id="hp-fill"></span><span class="meter-label" id="hp-label">100 / 100</span></div><div class="meter mp" role="meter" aria-label="內力" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30"><span class="meter-fill" id="mp-fill"></span><span class="meter-label" id="mp-label">30 / 30</span></div><div class="gold" id="player-gold">0 銀兩</div></div>
<div class="minimap-overlay"><canvas id="game-minimap" width="112" height="156" aria-label="小地圖"></canvas><span id="scene-name">青石鎮</span></div>
<div id="game-toast" role="status"></div>
<div id="touch-feedback" aria-hidden="true" hidden></div>
</main>
<menu id="game-menu" class="game-menu" hidden><button data-action="stop">停止移動</button><button data-action="rest">原地調息</button><button data-action="save">儲存進度</button><button data-action="load">讀取進度</button></menu>
<dialog id="npc-dialog" aria-labelledby="npc-name"><button id="npc-close" aria-label="關閉對話">×</button><h2 id="npc-name"></h2><p id="npc-text"></p></dialog>
</body></html>
